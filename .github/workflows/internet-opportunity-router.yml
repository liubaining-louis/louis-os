name: Internet Opportunity Router

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"
  workflow_run:
    workflows: ["Universal market monetization"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "atlas/internet_opportunity_router.py"
      - "atlas/github_reward_issue_source.py"
      - "scripts/internet_opportunity_router_cycle.py"
      - "scripts/taskforce_router_input_bridge.py"
      - "tests/test_internet_opportunity_router.py"
      - "tests/test_github_reward_issue_source.py"
      - "tests/test_taskforce_router_input_bridge.py"
      - "config/internet_opportunity_router.json"
      - "results/universal_market_opportunities.json"
      - "results/simple_mission_source_refresh.json"
      - "results/small_bounty_source_refresh.json"
      - "results/software_micro_mission_classification.json"
      - "results/cash_first_market.json"
      - "results/taskforce_market.json"
      - ".github/workflows/internet-opportunity-router.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: internet-opportunity-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-multidomain-opportunities:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require real GitHub runtime
        uses: ./.github/actions/github-runtime-preflight

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Louis OS
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Validate multidomain router
        run: |
          python -m unittest tests.test_internet_opportunity_router -v
          python -m unittest tests.test_github_reward_issue_source -v
          python -m unittest tests.test_taskforce_router_input_bridge -v

      - name: Inject TaskForce feed into router workspace
        run: python scripts/taskforce_router_input_bridge.py

      - name: Route current Internet opportunities
        run: python scripts/internet_opportunity_router_cycle.py

      - name: Persist router state with bounded conflict retries
        run: |
          git config user.name "louis-os[bot]"
          git config user.email "louis-os[bot]@users.noreply.github.com"
          test -f results/internet_opportunity_router.json
          git add -f results/internet_opportunity_router.json
          if test -f results/github_runtime_preflight.json; then
            git add -f results/github_runtime_preflight.json
          fi
          if git diff --cached --quiet; then
            echo "No router state changes"
            exit 0
          fi
          git commit -m "Record multidomain Internet opportunity router cycle"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Router write conflict on attempt ${attempt}; retrying"
            git rebase --abort || true
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done
          echo "Unable to persist router state after bounded retries"
          exit 1

      - name: Publish multidomain status
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY' > /tmp/router.md
          import json
          from pathlib import Path
          data = json.loads(Path("results/internet_opportunity_router.json").read_text())
          print("## Internet Opportunity Router")
          print()
          print(f"- Généré : {data.get('generated_at')}")
          print(f"- Opportunités inspectées : {data['items_seen']}")
          print(f"- Sources couvertes : {data.get('sources_seen', 0)}")
          print(f"- Domaines couverts : {data.get('domains_seen', 0)}")
          print(f"- Execute now : {data['decision_counts']['execute_now']}")
          print(f"- Prepare then gate : {data['decision_counts']['prepare_then_gate']}")
          print(f"- Capability build : {data['decision_counts']['capability_build']}")
          print(f"- Rejetées : {data['decision_counts']['reject']}")
          print(f"- Pivot : {data['next_pivot']}")
          print(f"- Prochaine action : {data['next_action']}")
          print("- Soumission externe vérifiée : 0")
          print(f"- Revenu vérifié : {data['truth']['revenue_verified_eur']} €")
          if data.get("selected"):
              selected = data["selected"]
              state = selected["internet_opportunity_router"]
              print(f"- Candidat sélectionné : {selected.get('title')}")
              print(f"- Domaine : {state['domain']}")
              print(f"- Décision : {state['decision']}")
          PY
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body-file /tmp/router.md
