name: AgentPact Profile Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agentpact-profile-probe.yml'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read AgentPact identity/profile state
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='sudo bash -s' <<'REMOTE' | tee /tmp/agentpact-profile.log
          set -euo pipefail
          source /var/lib/louis-os/secrets/agentpact.env
          AUTH="x-api-key: $AGENTPACT_API_KEY"
          echo "AUTH_AGENT_ID=$AGENTPACT_AGENT_ID"
          for target in \
            "https://api.agentpact.xyz/api/agents/$AGENTPACT_AGENT_ID" \
            "https://api.agentpact.xyz/api/offers/99aef21d-05dc-4375-bea6-94dd0b46ac5f" \
            "https://api.agentpact.xyz/api/agents/0699af94-76a9-411f-bb20-40ed9e101b37"; do
            echo "=== $target ==="
            code=$(curl -sS -o /tmp/ap.json -w '%{http_code}' "$target" -H "$AUTH")
            echo "HTTP=$code"
            python3 - <<'PY'
import json
p='/tmp/ap.json'
try:
    d=json.load(open(p))
except Exception:
    print(open(p).read()[:4000]); raise SystemExit
if isinstance(d,dict):
    for k in ('apiKey','api_key','key','token','secret','privateKey','private_key'):
        d.pop(k,None)
print(json.dumps(d,indent=2,ensure_ascii=False)[:8000])
PY
          done
          REMOTE
      - name: Publish probe summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## AgentPact identity/profile probe'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            tail -n 240 /tmp/agentpact-profile.log 2>/dev/null || true
            echo '```'
          } >/tmp/comment.md
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
