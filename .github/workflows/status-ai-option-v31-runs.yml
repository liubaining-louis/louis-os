name: Status AI Option V3.1 Runs
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/status-ai-option-v31-runs.yml']
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report V3.1 workflow statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'RECOVERY:' > /tmp/runs.txt
          gh run list --repo "$GITHUB_REPOSITORY" --workflow recover-ai-option-v31-sklearn19.yml --limit 3 --json databaseId,status,conclusion,url,createdAt >> /tmp/runs.txt
          echo 'PREPARE:' >> /tmp/runs.txt
          gh run list --repo "$GITHUB_REPOSITORY" --workflow prepare-retry-ai-option-v31.yml --limit 3 --json databaseId,status,conclusion,url,createdAt >> /tmp/runs.txt
          echo 'RUN_AS_LIUBAINING:' >> /tmp/runs.txt
          gh run list --repo "$GITHUB_REPOSITORY" --workflow run-ai-option-v31-as-liubaining.yml --limit 5 --json databaseId,status,conclusion,url,createdAt >> /tmp/runs.txt
          gh issue comment 451 --repo "$GITHUB_REPOSITORY" --body "V3.1 workflow status: \`$(cat /tmp/runs.txt)\`"
