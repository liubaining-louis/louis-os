name: Manic Typeform Final Submit

on:
  push:
    branches: [main]
    paths:
      - '.github/manic-typeform-submit-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Execute authorized single-bug Typeform submission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/submit.py <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json

          URL='https://form.typeform.com/to/TzfbvaPZ'
          TWITTER='@LiuMcBain'
          EMAIL='optimumanufacturing@gmail.com'
          MANIC_LOGIN=EMAIL
          DEPOSIT='De4yH9oHJwHjqeZkkP7h8SjHPQGRoUhUBULeCsFMRsCc'
          OCCURRED='August 9, 2026, 9:56 PM, UTC'
          TITLE='Polymarket multi-outcome market renders generic Team A / Team B labels and 0% probabilities'
          REPORT='''Bug: UEFA Champions League: 2027 Champion is rendered with incorrect generic outcome labels / zero probabilities in Manic Polymarket integration.\n\nSteps to reproduce:\n1. Open Manic Polymarket.\n2. Search for UEFA Champions League: 2027 Champion.\n3. Observe the market card/details.\n\nActual: the multi-outcome market can be represented with generic Team A / Team B labels and/or 0% probabilities rather than the real competitors and probabilities.\nExpected: Manic should preserve the actual multi-outcome teams and current probabilities from Polymarket.\nFrequency: reproduced 3/3 in the targeted production validation.\nEnvironment: Chromium, Linux, Manic production web app.\nImpact: incorrect market representation can mislead users reviewing a market.\nSuggested severity: P2 unless the same incorrect representation is confirmed in an actionable trade detail view.\n\nOnly the UEFA finding is submitted; the EPL hypothesis was excluded after evaluator correction.'''
          EVIDENCE_GLOB='/app/results/browser_evidence/manic-repro-31337812026-*-5232.png'

          def body(pg): return pg.locator('body').inner_text() or ''
          def question_text(e):
              try:
                  return e.evaluate("""el=>{let n=el; for(let i=0;i<10&&n;i++,n=n.parentElement){const t=(n.innerText||'').trim(); if(t.length>10&&t.length<3000)return t;} return ''; }""") or ''
              except Exception: return ''
          def active_question(pg):
              candidates=pg.locator('input:not([type=hidden]):not([type=file]),textarea')
              visible=[candidates.nth(i) for i in range(candidates.count()) if candidates.nth(i).is_visible()]
              if not visible: return None
              title=pg.title(); prompt=(title.split('|',1)[1].strip() if '|' in title else '').lower()
              if prompt:
                  for e in visible:
                      if prompt in question_text(e).lower(): return e
              focused=pg.locator('input:focus,textarea:focus')
              if focused.count() and focused.first.is_visible(): return focused.first
              ranked=[]
              for e in visible:
                  try:
                      box=e.bounding_box()
                      if box: ranked.append((abs((box['y']+box['height']/2)-500),e))
                  except Exception: pass
              return sorted(ranked,key=lambda x:x[0])[0][1] if ranked else visible[-1]
          def advance(pg):
              focused=pg.locator('input:focus,textarea:focus')
              if focused.count():
                  try: focused.first.press('Enter'); pg.wait_for_timeout(900); return True
                  except Exception: pass
              buttons=pg.get_by_role('button',name='OK',exact=False)
              for i in range(buttons.count()):
                  try:
                      if buttons.nth(i).is_visible(): buttons.nth(i).click(); pg.wait_for_timeout(900); return True
                  except Exception: pass
              return False
          def choose(pg,label):
              # Prefer explicit buttons, then exact visible text.
              btn=pg.get_by_role('button',name=label,exact=False)
              for i in range(btn.count()):
                  try:
                      if btn.nth(i).is_visible(): btn.nth(i).click(); pg.wait_for_timeout(900); return True
                  except Exception: pass
              loc=pg.get_by_text(label,exact=True)
              for i in range(loc.count()):
                  try:
                      if loc.nth(i).is_visible(): loc.nth(i).click(); pg.wait_for_timeout(900); return True
                  except Exception: pass
              return False
          def upload_evidence(pg):
              paths=sorted(Path('/app/results/browser_evidence').glob('manic-repro-31337812026-*-5232.png'))
              if not paths:
                  raise RuntimeError('validated_uefa_screenshot_not_found')
              file_input=pg.locator('input[type=file]')
              if not file_input.count():
                  raise RuntimeError('typeform_file_input_not_found')
              file_input.first.set_input_files(str(paths[0]))
              pg.wait_for_timeout(1800)
              return str(paths[0])

          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              pg=b.new_page(viewport={'width':1440,'height':1000})
              pg.goto(URL,wait_until='domcontentloaded',timeout=30000); pg.wait_for_timeout(3000)
              start=pg.get_by_role('button',name='Start')
              if start.count(): start.first.click(); pg.wait_for_timeout(900)
              trace=[]; submitted=False; uploaded=None
              for step in range(1,70):
                  text=body(pg); low=text.lower(); title=pg.title(); title_low=title.lower(); trace.append({'step':step,'title':title,'body':text[:3500]})
                  if 'thank you' in low or 'response has been submitted' in low:
                      submitted=True; break

                  submit=pg.get_by_role('button',name='Submit',exact=False)
                  if submit.count() and submit.first.is_visible():
                      submit.first.click(); pg.wait_for_timeout(4500)
                      final=body(pg).lower(); submitted=('thank you' in final or 'response has been submitted' in final or 'submitted' in final)
                      trace.append({'step':'after_submit','title':pg.title(),'body':body(pg)[:5000]}); break

                  if 'what are you submitting' in title_low or 'what are you submitting' in low:
                      if choose(pg,'A bug'): advance(pg); continue

                  if 'how often does this happen' in title_low or 'how often does this happen' in low:
                      if choose(pg,'Every time'): advance(pg); continue

                  if 'upload a screenshot or screen recording' in title_low or 'upload a screenshot or screen recording' in low:
                      uploaded=upload_evidence(pg)
                      if not advance(pg):
                          # Typeform may auto-advance after a successful upload.
                          pg.wait_for_timeout(1200)
                      continue

                  e=active_question(pg)
                  if e is not None:
                      q=(question_text(e)+' '+title).lower(); typ=(e.get_attribute('type') or '').lower(); tag=e.evaluate('e=>e.tagName.toLowerCase()')
                      if 'manic login account' in title_low or 'manic login account' in q: val=MANIC_LOGIN
                      elif 'polymarket deposit address' in title_low or 'polymarket deposit address' in q: val=DEPOSIT
                      elif 'when did it happen' in title_low or 'when did it happen' in q: val=OCCURRED
                      elif typ=='email' or 'what email can we use' in title_low or 'what email can we use' in q: val=EMAIL
                      elif 'x / twitter' in title_low or 'twitter account' in title_low or 'x / twitter' in q or 'twitter account' in q: val=TWITTER
                      elif 'superteam earn profile' in title_low or 'superteam earn profile' in q: val=''
                      elif 'title' in q and ('bug' in q or 'issue' in q): val=TITLE
                      elif tag=='textarea' or any(x in q for x in ['describe','details','steps to reproduce','explain','what happened','expected','actual result','expected result']): val=REPORT
                      else: val=TITLE
                      if val:
                          e.fill(val); pg.wait_for_timeout(300)
                      if not advance(pg): break
                      continue

                  # Other explicit multiple-choice fields encountered later.
                  if 'severity' in title_low:
                      for choice in ('P2','Medium','Moderate'):
                          if choose(pg,choice): advance(pg); break
                      else: break
                      continue

                  if choose(pg,'A bug'): advance(pg); continue
                  if not advance(pg): break

              print('SUBMIT_RESULT='+json.dumps({'submitted':submitted,'uploaded_evidence':uploaded,'url':pg.url,'title':pg.title(),'final_body':body(pg)[:7000],'trace':trace[-15:]},ensure_ascii=False))
              b.close()
          PY
          ENC="$(base64 -w0 /tmp/submit.py)"
          gcloud compute ssh "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}" --quiet --command="echo '${ENC}' | base64 -d | sudo docker exec -i louis-os-worker python -" | tee /tmp/submit.log
          grep '^SUBMIT_RESULT=' /tmp/submit.log | tail -1 | sed 's/^SUBMIT_RESULT=//' >/tmp/result.json
          test -s /tmp/result.json
          { echo '## Authorized Manic Typeform submission result'; echo; echo '```json'; jq -c '{submitted,uploaded_evidence,url,title,final_body}' /tmp/result.json; echo '```'; echo; echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; } >/tmp/comment.md
          gh issue comment 322 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          jq -e '.submitted == true' /tmp/result.json >/dev/null
