name: Manic Typeform Final Submit

on:
  push:
    branches: [main]
    paths:
      - '.github/manic-typeform-submit-trigger.txt'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Execute authorized single-bug Typeform submission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/submit.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json, time

          URL='https://form.typeform.com/to/TzfbvaPZ'
          TWITTER='@LiuMcBain'
          EMAIL='optimumanufacturing@gmail.com'
          MANIC_LOGIN=EMAIL
          DEPOSIT='De4yH9oHJwHjqeZkkP7h8SjHPQGRoUhUBULeCsFMRsCc'
          TITLE='Polymarket multi-outcome market renders generic Team A / Team B labels and 0% probabilities'
          REPORT='''Bug: UEFA Champions League: 2027 Champion is rendered with incorrect generic outcome labels / zero probabilities in Manic Polymarket integration.\n\nSteps to reproduce:\n1. Open Manic Polymarket.\n2. Search for UEFA Champions League: 2027 Champion.\n3. Observe the market card/details.\n\nActual: the multi-outcome market can be represented with generic Team A / Team B labels and/or 0% probabilities rather than the real competitors and probabilities.\nExpected: Manic should preserve the actual multi-outcome teams and current probabilities from Polymarket.\nFrequency: reproduced 3/3 in the targeted production validation.\nEnvironment: Chromium, Linux, Manic production web app.\nImpact: incorrect market representation can mislead users reviewing a market.\nSuggested severity: P2 unless the same incorrect representation is confirmed in an actionable trade detail view.\n\nOnly the UEFA finding is submitted; the EPL hypothesis was excluded after evaluator correction.'''

          def body(pg): return (pg.locator('body').inner_text() or '')
          def visible_inputs(pg):
              loc=pg.locator('input:not([type=hidden]),textarea')
              return [loc.nth(i) for i in range(loc.count()) if loc.nth(i).is_visible()]
          def click_named(pg, names):
              for name in names:
                  loc=pg.get_by_text(name, exact=False)
                  for i in range(min(loc.count(),10)):
                      try:
                          if loc.nth(i).is_visible(): loc.nth(i).click(); pg.wait_for_timeout(700); return True
                      except Exception: pass
              return False
          def advance(pg):
              for label in ['OK','Next','Continue']:
                  loc=pg.get_by_role('button', name=label, exact=False)
                  if loc.count():
                      try: loc.first.click(); pg.wait_for_timeout(700); return True
                      except Exception: pass
              try: pg.keyboard.press('Enter'); pg.wait_for_timeout(700); return True
              except Exception: return False

          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              pg=b.new_page(viewport={'width':1440,'height':1000})
              pg.goto(URL,wait_until='domcontentloaded',timeout=30000); pg.wait_for_timeout(3000)
              s=pg.get_by_role('button',name='Start')
              if s.count(): s.first.click(); pg.wait_for_timeout(800)
              trace=[]; submitted=False
              for step in range(1,30):
                  text=body(pg); low=text.lower(); trace.append({'step':step,'title':pg.title(),'body':text[:5000]})
                  if 'thank you' in low or 'response has been submitted' in low or 'submitted' in low and 'submit' not in low:
                      submitted=True; break
                  vals=visible_inputs(pg)
                  if vals:
                      e=vals[0]; typ=(e.get_attribute('type') or '').lower(); q=low
                      if typ=='email' or 'what email can we use' in q: val=EMAIL
                      elif 'x / twitter' in q or 'twitter account' in q: val=TWITTER
                      elif 'superteam earn profile' in q: val=''
                      elif 'manic login account' in q: val=MANIC_LOGIN
                      elif 'polymarket deposit address' in q: val=DEPOSIT
                      elif 'title' in q and ('bug' in q or 'issue' in q): val=TITLE
                      elif 'describe' in q or 'details' in q or 'steps to reproduce' in q or 'explain' in q: val=REPORT
                      else: val=REPORT if e.evaluate('e=>e.tagName.toLowerCase()')=='textarea' else TITLE
                      if val:
                          e.fill(val)
                      advance(pg); continue
                  if 'what are you submitting' in low:
                      if click_named(pg,['A bug']): advance(pg); continue
                  # Choose Bug where a bug/improvement category is presented.
                  if click_named(pg,['A bug']): advance(pg); continue
                  # Final submit is explicitly authorized by the user.
                  submit=pg.get_by_role('button',name='Submit',exact=False)
                  if submit.count() and submit.first.is_visible():
                      submit.first.click(); pg.wait_for_timeout(3500)
                      submitted=True; trace.append({'step':'after_submit','title':pg.title(),'body':body(pg)[:7000]}); break
                  if not advance(pg): break
              print('SUBMIT_RESULT='+json.dumps({'submitted':submitted,'url':pg.url,'title':pg.title(),'final_body':body(pg)[:7000],'trace':trace[-8:]},ensure_ascii=False))
              b.close()
          PY
          ENC="$(base64 -w0 /tmp/submit.py)"
          gcloud compute ssh "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}" --quiet --command="echo '${ENC}' | base64 -d | sudo docker exec -i louis-os-worker python -" | tee /tmp/submit.log
          grep '^SUBMIT_RESULT=' /tmp/submit.log | tail -1 | sed 's/^SUBMIT_RESULT=//' >/tmp/result.json
          test -s /tmp/result.json
          { echo '## Authorized Manic Typeform submission result'; echo; echo '```json'; jq -c '{submitted,url,title,final_body}' /tmp/result.json; echo '```'; echo; echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; } >/tmp/comment.md
          gh issue comment 322 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          jq -e '.submitted == true' /tmp/result.json >/dev/null
