name: Probe model provider secret names

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-model-provider-secrets.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: List secret names only
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets list --project="${PROJECT_ID}" --format='value(name)' | sed -E 's/(.)/\1/g'
