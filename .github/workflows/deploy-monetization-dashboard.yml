name: Deploy Monetization Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "atlas/monetization_dashboard.py"
      - "results/monetization.json"
      - "results/monetization_experiments.jsonl"
      - "results/evidence.jsonl"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/deploy-monetization-dashboard.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: louis-os-monetization-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and test dashboard
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m unittest discover -s tests -p 'test_monetization_dashboard.py' -v

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: test-bot-499814
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build immutable container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="gcr.io/test-bot-499814/louis-os-monetization:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          BUILD_ID="$(gcloud builds submit \
            --project=test-bot-499814 \
            --tag="${IMAGE}" \
            --async \
            --format='value(id)' \
            .)"

          test -n "${BUILD_ID}"
          echo "Cloud Build ID: ${BUILD_ID}"

          for attempt in $(seq 1 60); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" \
              --project=test-bot-499814 \
              --format='value(status)')"
            echo "Build status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            if [[ "${attempt}" -eq 60 ]]; then exit 1; fi
            sleep 10
          done

      - name: Deploy fresh dashboard service
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="louis-os-monetization-v3"
          echo "SERVICE=${SERVICE}" >> "$GITHUB_ENV"
          gcloud run deploy "${SERVICE}" \
            --project=test-bot-499814 \
            --image="${IMAGE}" \
            --region=europe-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --port=8080 \
            --command=python \
            --args=-m,atlas.monetization_dashboard \
            --set-env-vars="ATLAS_BUILD_SHA=${GITHUB_SHA}"

      - name: Smoke test and publish URL
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --project=test-bot-499814 --region=europe-west1 --format='value(status.url)')"
          echo "Service URL: ${SERVICE_URL}"

          for attempt in $(seq 1 24); do
            HEALTH_CODE="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "${SERVICE_URL}/healthz" || true)"
            echo "Health attempt ${attempt}: HTTP ${HEALTH_CODE}"
            cat /tmp/health.json || true
            echo
            if [[ "${HEALTH_CODE}" == "200" ]] && python -c 'import json; assert json.load(open("/tmp/health.json"))["status"] == "ok"'; then
              break
            fi
            if [[ "${attempt}" -eq 24 ]]; then
              gcloud run services describe "${SERVICE}" --project=test-bot-499814 --region=europe-west1 --format=yaml || true
              gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="louis-os-monetization-v3"' --project=test-bot-499814 --limit=100 --freshness=30m --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
              exit 1
            fi
            sleep 5
          done

          ROOT_HTML="$(curl --fail --silent --show-error "${SERVICE_URL}/")"
          echo "${ROOT_HTML}" | grep -q 'ATLAS · Live Monetization'

          STATUS_JSON="$(curl --fail --silent --show-error "${SERVICE_URL}/api/status")"
          echo "${STATUS_JSON}" | python -c 'import json,sys; d=json.load(sys.stdin); assert "metrics" in d and "integrity" in d'
          {
            echo "## ATLAS Monetization Dashboard"
            echo "${SERVICE_URL}"
            echo "Health: OK"
            echo "Dashboard identity: OK"
            echo "API status: OK"
            echo "Build: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
