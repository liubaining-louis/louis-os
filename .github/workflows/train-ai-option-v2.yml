name: Train AI Option V2 Challenger

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/train-ai-option-v2.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      PROJECT_ID: test-bot-499814
      ZONE: europe-central2-a
      VM_NAME: gemini12345
      STATUS_ISSUE: '449'
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Train and evaluate V2 challenger
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/train-v2.sh <<'REMOTE'
          set -euo pipefail
          APP=/home/liubaining/AI-Option-Trader
          cd "$APP"
          mkdir -p models/v2 data/v2
          cat > train_challenger_v2.py <<'PY'
          import json, math, os, random
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import yfinance as yf
          import gymnasium as gym
          from gymnasium import spaces
          from scipy.stats import norm
          from stable_baselines3 import PPO

          TICKERS=['TSLA','AAPL','NVDA','MSFT','AMZN','META','GOOGL','AMD']
          R=0.04
          MAX_DTE=20
          COST=0.005
          INVALID=0.02
          SEEDS=[17,42,91]
          STEPS=120_000
          OUT=Path('models/v2'); DATA=Path('data/v2')
          OUT.mkdir(parents=True,exist_ok=True); DATA.mkdir(parents=True,exist_ok=True)

          def bs_call(S,K,T,r,sigma):
              if T<=0 or sigma<=0: return max(0.0,S-K)
              sigma=max(float(sigma),1e-6)
              d1=(math.log(S/K)+(r+0.5*sigma*sigma)*T)/(sigma*math.sqrt(T))
              d2=d1-sigma*math.sqrt(T)
              return S*norm.cdf(d1)-K*math.exp(-r*T)*norm.cdf(d2)

          def featureize(df,ticker):
              x=df.copy()
              x['SMA20']=x['Close'].rolling(20).mean()
              delta=x['Close'].diff(); gain=delta.clip(lower=0); loss=-delta.clip(upper=0)
              ag=gain.ewm(alpha=1/14,adjust=False,min_periods=14).mean()
              al=loss.ewm(alpha=1/14,adjust=False,min_periods=14).mean()
              rs=ag/al.replace(0,np.nan); x['RSI_14']=100-(100/(1+rs))
              ema12=x['Close'].ewm(span=12,adjust=False).mean(); ema26=x['Close'].ewm(span=26,adjust=False).mean()
              x['MACD']=ema12-ema26
              ret=x['Close'].pct_change(); x['Volatility']=ret.rolling(20).std()*np.sqrt(252)
              x=x.dropna().copy(); x['Ticker']=ticker
              return x

          frames={}
          for t in TICKERS:
              h=yf.Ticker(t).history(period='6y')
              if h is None or len(h)<700: raise RuntimeError(f'{t}: insufficient Yahoo history: {0 if h is None else len(h)}')
              frames[t]=featureize(h,t)

          split={'train':{},'val':{},'test':{}}
          split_meta={}
          for t,g in frames.items():
              g=g.sort_index().copy(); n=len(g); a=int(n*0.70); b=int(n*0.85)
              split['train'][t]=g.iloc[:a].copy(); split['val'][t]=g.iloc[a:b].copy(); split['test'][t]=g.iloc[b:].copy()
              split_meta[t]={'rows':n,'train':a,'val':b-a,'test':n-b,
                             'start':str(g.index[0].date()),'end':str(g.index[-1].date())}
          for part in ('train','val','test'):
              pd.concat(split[part].values()).to_csv(DATA/f'{part}.csv')

          class OptionV2Env(gym.Env):
              def __init__(self, groups, seed=0):
                  super().__init__(); self.groups={k:v.reset_index(drop=True) for k,v in groups.items()}
                  self.tickers=[k for k,v in self.groups.items() if len(v)>MAX_DTE+2]
                  self.action_space=spaces.Discrete(3)
                  self.observation_space=spaces.Box(-5,5,shape=(7,),dtype=np.float32)
                  self.rng=np.random.default_rng(seed)
              def _choose(self):
                  self.ticker=self.rng.choice(self.tickers); self.df=self.groups[self.ticker]
                  self.start=int(self.rng.integers(0,len(self.df)-MAX_DTE-1)); self.i=self.start
                  self.dte=MAX_DTE; self.position=0; self.strike=0.; self.entry=0.; self.last_mark=0.
              def reset(self,seed=None,options=None):
                  super().reset(seed=seed)
                  if seed is not None: self.rng=np.random.default_rng(seed)
                  self._choose(); return self._obs(),{}
              def _obs(self):
                  row=self.df.iloc[self.i]; S=float(row.Close); sma=float(row.SMA20)
                  price_rel=S/sma-1.0; dte=self.dte/MAX_DTE; pos=float(self.position)
                  rsi=(float(row.RSI_14)-50.0)/50.0; macd=float(row.MACD)/max(S,1e-9)
                  vol=min(max(float(row.Volatility),0.0),3.0); upnl=0.0
                  if self.position:
                      mark=bs_call(S,self.strike,self.dte/252.0,R,vol)
                      upnl=mark/max(self.entry,1e-9)-1.0
                  return np.clip(np.array([price_rel,dte,pos,rsi,macd,vol,upnl],dtype=np.float32),-5,5)
              def step(self,action):
                  action=int(action); row=self.df.iloc[self.i]; S=float(row.Close); vol=float(row.Volatility)
                  reward=0.0; terminated=False
                  if self.position:
                      mark=bs_call(S,self.strike,self.dte/252.0,R,vol)
                      mtm=(mark-self.last_mark)/max(self.entry,1e-9)
                      if action==2:
                          reward += mtm-COST; self.position=0; terminated=True
                      elif action==0:
                          reward += mtm; self.last_mark=mark
                      else:
                          reward += mtm-INVALID; self.last_mark=mark
                  else:
                      if action==1:
                          self.position=1; self.strike=S
                          self.entry=bs_call(S,S,self.dte/252.0,R,vol); self.last_mark=self.entry
                          reward -= COST
                      elif action==2:
                          reward -= INVALID
                  if not terminated:
                      self.i+=1; self.dte-=1
                      if self.dte<=0 or self.i>=len(self.df)-1:
                          if self.position:
                              finalS=float(self.df.iloc[self.i].Close); final=max(0.0,finalS-self.strike)
                              reward += (final-self.last_mark)/max(self.entry,1e-9)-COST
                              self.position=0
                          terminated=True
                  obs=self._obs() if not terminated else np.zeros(7,dtype=np.float32)
                  return obs,float(np.clip(reward,-2,2)),terminated,False,{}

          def obs_for(row,dte,pos,strike,entry):
              S=float(row.Close); vol=min(max(float(row.Volatility),0.0),3.0)
              upnl=0.0
              if pos:
                  upnl=bs_call(S,strike,dte/252.0,R,vol)/max(entry,1e-9)-1.0
              arr=np.array([S/float(row.SMA20)-1,dte/MAX_DTE,float(pos),(float(row.RSI_14)-50)/50,
                            float(row.MACD)/max(S,1e-9),vol,upnl],dtype=np.float32)
              return np.clip(arr,-5,5)

          def metrics(returns, trades, action_counts, blocks):
              r=np.asarray(returns,float); tr=np.asarray(trades,float)
              mean=float(r.mean()) if len(r) else 0.; sd=float(r.std(ddof=1)) if len(r)>1 else 0.
              sharpe=mean/sd*math.sqrt(252/MAX_DTE) if sd>1e-12 else 0.
              eq=np.cumsum(r); peak=np.maximum.accumulate(np.concatenate(([0.0],eq)))[1:]
              maxdd=float(np.max(peak-eq)) if len(eq) else 0.
              pos=float(tr[tr>0].sum()) if len(tr) else 0.; neg=float(-tr[tr<0].sum()) if len(tr) else 0.
              pf=(pos/neg) if neg>1e-12 else (999.0 if pos>0 else 0.0)
              total=sum(action_counts.values()) or 1
              return {'blocks':blocks,'trades':len(trades),'trade_rate_pct':100*len(trades)/max(blocks,1),
                      'win_rate_pct':100*float((tr>0).mean()) if len(tr) else None,
                      'avg_block_return_pct':100*mean,'median_trade_return_pct':100*float(np.median(tr)) if len(tr) else None,
                      'profit_factor':pf,'sharpe':sharpe,'max_drawdown_return_units':maxdd,
                      'action_counts':action_counts,'action_pct':{str(k):100*v/total for k,v in action_counts.items()}}

          def evaluate(model,groups):
              rets=[]; trades=[]; baseline=[]; actions={0:0,1:0,2:0}; per={}; blocks=0
              for t,g0 in groups.items():
                  g=g0.reset_index(drop=True); tret=[]; tbase=[]
                  for start in range(0,len(g)-MAX_DTE-1,MAX_DTE):
                      blocks+=1; pos=0; strike=entry=0.; realized=0.; bought=False; dte=MAX_DTE; i=start
                      while dte>0 and i<len(g)-1:
                          row=g.iloc[i]; ob=obs_for(row,dte,pos,strike,entry)
                          a,_=model.predict(ob,deterministic=True); a=int(np.asarray(a).item()); actions[a]+=1
                          S=float(row.Close); vol=float(row.Volatility)
                          if not pos and a==1:
                              pos=1; bought=True; strike=S; entry=bs_call(S,S,dte/252.0,R,vol)
                          elif pos and a==2:
                              mark=bs_call(S,strike,dte/252.0,R,vol)
                              realized=(mark*(1-COST)-entry*(1+COST))/max(entry*(1+COST),1e-9); pos=0; break
                          i+=1; dte-=1
                      if bought and pos:
                          finalS=float(g.iloc[min(i,len(g)-1)].Close); final=max(0.0,finalS-strike)
                          realized=(final*(1-COST)-entry*(1+COST))/max(entry*(1+COST),1e-9)
                      if bought: trades.append(realized); tret.append(realized); rets.append(realized)
                      else: rets.append(0.0)
                      row0=g.iloc[start]; S0=float(row0.Close); v0=float(row0.Volatility)
                      prem=bs_call(S0,S0,MAX_DTE/252.0,R,v0); finalS=float(g.iloc[start+MAX_DTE].Close); val=max(0.0,finalS-S0)
                      br=(val*(1-COST)-prem*(1+COST))/max(prem*(1+COST),1e-9); baseline.append(br); tbase.append(br)
                  if tret:
                      per[t]={'trades':len(tret),'win_rate_pct':100*float((np.asarray(tret)>0).mean()),'avg_return_pct':100*float(np.mean(tret))}
                  else: per[t]={'trades':0,'win_rate_pct':None,'avg_return_pct':None}
              m=metrics(rets,trades,actions,blocks)
              bm=metrics(baseline,baseline,{0:0,1:blocks,2:0},blocks)
              m['per_ticker']=per; return m,bm

          train_env=OptionV2Env(split['train'],seed=123)
          candidates=[]
          for seed in SEEDS:
              random.seed(seed); np.random.seed(seed)
              model=PPO('MlpPolicy',train_env,learning_rate=2e-4,n_steps=1024,batch_size=256,n_epochs=10,
                        gamma=0.99,gae_lambda=0.95,clip_range=0.2,ent_coef=0.02,vf_coef=0.5,
                        policy_kwargs=dict(net_arch=[128,128]),seed=seed,verbose=0,device='cpu')
              model.learn(total_timesteps=STEPS,progress_bar=False)
              path=OUT/f'ppo_option_v2_seed{seed}'; model.save(path)
              vm,vb=evaluate(model,split['val'])
              score=(vm['sharpe']-vb['sharpe']) + 0.20*(vm['profit_factor']-vb['profit_factor'])
              candidates.append({'seed':seed,'score':score,'validation':vm,'baseline':vb,'path':str(path)+'.zip'})
              print('SEED_DONE',seed,'score',round(score,4),flush=True)

          best=max(candidates,key=lambda x:x['score']); best_model=PPO.load(best['path'],device='cpu')
          best_model.save(OUT/'ppo_option_model_v2_candidate')
          test_m,test_b=evaluate(best_model,split['test'])
          max_action=max(test_m['action_pct'].values()) if test_m['action_pct'] else 100
          gate={
              'enough_trades':test_m['trades']>=30,
              'nontrivial_trade_rate':20<=test_m['trade_rate_pct']<=95,
              'beats_baseline_sharpe':test_m['sharpe']>test_b['sharpe']+0.15,
              'profit_factor_above_1_1':test_m['profit_factor']>1.10,
              'not_single_action_collapse':max_action<97,
          }
          gate['passed']=all(gate.values())
          result={'version':'v2-challenger','tickers':TICKERS,'steps_per_seed':STEPS,'seeds':SEEDS,'split_meta':split_meta,
                  'features':['price_vs_sma20','dte_norm','position','rsi_centered','macd_over_price','annualized_volatility','unrealized_option_return'],
                  'cost_per_side':COST,'invalid_action_penalty':INVALID,'candidates':candidates,
                  'selected_seed':best['seed'],'held_out_test':test_m,'held_out_baseline':test_b,'release_gate':gate,
                  'production_model_overwritten':False}
          (OUT/'training_report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('=== V2_RESULT_JSON ==='); print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          chown -R liubaining:liubaining models/v2 data/v2 train_challenger_v2.py
          sudo -u liubaining -H ./venv/bin/python train_challenger_v2.py | tee /tmp/v2-training.log
          REMOTE
          gcloud compute ssh "$VM_NAME" --project="$PROJECT_ID" --zone="$ZONE" --quiet --command='sudo bash -s' < /tmp/train-v2.sh | tee /tmp/run.log
      - name: Publish V2 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## AI Option V2 challenger training'
            echo
            echo '```text'
            tail -n 500 /tmp/run.log 2>/dev/null || echo 'No training output.'
            echo '```'
          } >/tmp/report.md
          gh issue comment "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
