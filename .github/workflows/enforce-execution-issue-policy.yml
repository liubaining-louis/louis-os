name: Enforce ATLAS execution issue policy

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened, edited]
  push:
    branches: [main]
    paths:
      - 'config/production_policy.json'
      - 'atlas/production_policy.py'
      - 'scripts/enforce_execution_issue_policy.py'
      - '.github/workflows/enforce-execution-issue-policy.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: execution-issue-policy
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate policy enforcer
        run: |
          python -m pip install .
          python -m unittest tests.test_execution_issue_policy -v
          python -m unittest tests.test_production_policy -v
      - name: Close strategy-violating internal execution tickets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/enforce_execution_issue_policy.py
