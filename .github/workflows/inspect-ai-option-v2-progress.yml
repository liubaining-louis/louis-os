name: Inspect AI Option V2 Progress
on:
  push:
    paths: ['.github/workflows/inspect-ai-option-v2-progress.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: test-bot-499814
      ZONE: europe-central2-a
      VM_NAME: gemini12345
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Probe
        run: |
          gcloud compute ssh "$VM_NAME" --project="$PROJECT_ID" --zone="$ZONE" --quiet --command="echo '=== PROCESS ==='; ps -eo pid,etime,%cpu,%mem,cmd | grep -E 'train_challenger_v2.py|python' | grep -v grep | tail -20; echo '=== MODELS ==='; ls -lh /home/liubaining/AI-Option-Trader/models/v2 2>/dev/null || true; echo '=== DATA ==='; ls -lh /home/liubaining/AI-Option-Trader/data/v2 2>/dev/null || true" | tee /tmp/probe.log
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## V2 training progress'; echo; echo '```text'; cat /tmp/probe.log 2>/dev/null || true; echo '```'; } >/tmp/report.md
          gh issue comment 449 --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
# trigger-now
