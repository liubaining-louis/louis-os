name: BountyBook authorized submission

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bountybook-authorized-submit.yml"
      - "config/bountybook_authorized_submission.json"
      - "scripts/bountybook_authorized_submit.py"
      - "tests/test_bountybook_authorized_submit.py"
      - "deliverables/bountybook_http_server_19a16071/http_server.py"

permissions:
  contents: write
  id-token: write

concurrency:
  group: bountybook-authorized-submission
  cancel-in-progress: false

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01
  # One bounded retry after attempt 2 failed inside BountyBook's ipfs_fetch
  # module before any deliverable check ran.
  RECEIPT_PATH: results/bountybook_http_server_19a16071_resubmission_3.json

jobs:
  claim-submit-verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate exact authorized deliverable
        run: |
          set -euo pipefail
          python -m unittest tests.test_bountybook_http_server_deliverable -v
          python -m unittest tests.test_bountybook_authorized_submit -v
          python -m json.tool config/bountybook_authorized_submission.json >/dev/null

      - name: Refuse duplicate verified resubmission
        id: duplicate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${RECEIPT_PATH}" ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path(os.environ["RECEIPT_PATH"]).read_text())
          if (payload.get("submission") or {}).get("verified") is not True:
              raise SystemExit("existing receipt is not a verified submission")
          print("Corrected resubmission already has a verified platform receipt; no duplicate action.")
          PY
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.duplicate.outputs.skip != 'true'
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        if: steps.duplicate.outputs.skip != 'true'

      - name: Copy hash-pinned submission package to VM
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute scp \
            scripts/bountybook_authorized_submit.py \
            config/bountybook_authorized_submission.json \
            deliverables/bountybook_http_server_19a16071/http_server.py \
            "${VM_NAME}:/tmp/" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --quiet

      - name: Authenticate, claim and submit from VM-local identity
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          IMAGE="$(docker inspect -f '{{.Config.Image}}' louis-os-worker)"
          test -n "${IMAGE}"
          test -s /var/lib/louis-os/secrets/base-evm-private-key
          docker run --rm --name louis-bountybook-authorized-submit \
            -v /var/lib/louis-os/secrets:/app/runtime-secrets:ro \
            -v /var/lib/louis-os/results:/app/results \
            -v /tmp/bountybook_authorized_submit.py:/app/bountybook_authorized_submit.py:ro \
            -v /tmp/bountybook_authorized_submission.json:/app/bountybook_authorized_submission.json:ro \
            -v /tmp/http_server.py:/app/http_server.py:ro \
            "${IMAGE}" python /app/bountybook_authorized_submit.py \
            --authorization /app/bountybook_authorized_submission.json \
            --artifact /app/http_server.py \
            --secret-dir /app/runtime-secrets \
            --receipt /app/results/bountybook_http_server_19a16071_resubmission_3.json
          REMOTE

      - name: Pull sanitized platform receipt
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet \
            --command='sudo docker exec louis-os-worker cat /app/results/bountybook_http_server_19a16071_resubmission_3.json' \
            > "${RECEIPT_PATH}"
          python -m json.tool "${RECEIPT_PATH}" >/dev/null
          ! grep -Eqi 'session-secret|bearer |"token"[[:space:]]*:|"signature"[[:space:]]*:|"nonce"[[:space:]]*:|"private_key"[[:space:]]*:' "${RECEIPT_PATH}"

      - name: Persist verified claim and submission truth
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "louis-os[bot]"
          git config user.email "louis-os[bot]@users.noreply.github.com"
          git add -f "${RECEIPT_PATH}"
          git commit -m "Record bounded BountyBook infrastructure retry"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          exit 1
