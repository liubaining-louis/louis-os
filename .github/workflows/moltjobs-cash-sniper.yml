name: MoltJobs Cash Sniper

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/moltjobs-cash-sniper.yml'
      - 'scripts/moltjobs_cash_sniper.py'
      - 'atlas/production_policy.py'
      - 'config/production_policy.json'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  snipe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Copy bounded runtime files to VM
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute scp scripts/moltjobs_cash_sniper.py "${VM_NAME}:/tmp/moltjobs_cash_sniper.py" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet
          gcloud compute scp atlas/production_policy.py "${VM_NAME}:/tmp/production_policy.py" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet
          gcloud compute scp config/production_policy.json "${VM_NAME}:/tmp/production_policy.json" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet

      - name: Maintain qualified micro-mission portfolio as unprivileged runtime
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="
            set -euo pipefail
            id louis-os >/dev/null 2>&1 || { echo 'LOUIS_RUNTIME_USER_MISSING'; exit 20; }
            sudo -u louis-os env \
              PYTHONPATH=/tmp \
              LOUIS_PRODUCTION_POLICY=/tmp/production_policy.json \
              MOLT_NO_UPDATE_CHECK=1 \
              MOLTJOBS_AGENT_ID=louis \
              MOLTJOBS_MAX_BIDS_PER_RUN=5 \
              MOLTJOBS_MIN_BUDGET=1 \
              MOLTJOBS_MAX_BUDGET=15 \
              MOLTJOBS_MIN_CREDIT_RESERVE=5 \
              MOLTJOBS_TARGET_PORTFOLIO=8 \
              MOLTJOBS_MAX_PORTFOLIO=10 \
              MOLTJOBS_RECENT_BID_HOURS=72 \
              python3 /tmp/moltjobs_cash_sniper.py
          "
