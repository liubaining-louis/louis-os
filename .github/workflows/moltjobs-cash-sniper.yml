name: MoltJobs Cash Sniper

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/moltjobs-cash-sniper.yml'
      - 'scripts/moltjobs_cash_sniper.py'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  snipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Copy cash sniper to VM
        run: gcloud compute scp scripts/moltjobs_cash_sniper.py "${VM_NAME}:/tmp/moltjobs_cash_sniper.py" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet
      - name: Maintain an 8-item qualified micro-mission portfolio
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="sudo bash -c '
            set -euo pipefail
            export MOLT_NO_UPDATE_CHECK=1
            export MOLTJOBS_AGENT_ID=louis
            export MOLTJOBS_MAX_BIDS_PER_RUN=5
            export MOLTJOBS_MIN_BUDGET=1
            export MOLTJOBS_MAX_BUDGET=15
            export MOLTJOBS_MIN_CREDIT_RESERVE=5
            export MOLTJOBS_TARGET_PORTFOLIO=8
            export MOLTJOBS_MAX_PORTFOLIO=10
            export MOLTJOBS_RECENT_BID_HOURS=72
            python3 /tmp/moltjobs_cash_sniper.py
          '"
