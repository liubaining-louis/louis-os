name: Deploy Louis OS Chat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "atlas/louis_chat_v6.py"
      - "atlas/web_gateway.py"
      - "atlas/louis_state.py"
      - ".github/workflows/deploy-louis-chat.yml"
      - "Dockerfile"
      - "pyproject.toml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: louis-os-chat-production
  cancel-in-progress: false

env:
  PROJECT_ID: test-bot-499814
  REGION: europe-west1
  SERVICE: louis-os-chat

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build chat image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="gcr.io/${PROJECT_ID}/louis-os-chat:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          BUILD_ID="$(gcloud builds submit --project="${PROJECT_ID}" --tag="${IMAGE}" --async --format='value(id)' .)"
          test -n "${BUILD_ID}"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "Build status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            [[ "${attempt}" -lt 90 ]] || exit 1
            sleep 10
          done

      - name: Deploy keyless chat with deterministic web research
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SA="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          if [[ -z "${RUNTIME_SA}" ]]; then RUNTIME_SA="${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"; fi

          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --platform=managed \
            --image="${IMAGE}" \
            --command=python \
            --args=-m,atlas.louis_chat_v6 \
            --service-account="${RUNTIME_SA}" \
            --allow-unauthenticated \
            --remove-secrets=LOUIS_CHAT_KEY \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_LOCATION=${REGION},LOUIS_CHAT_MODEL=gemini-2.5-flash,LOUIS_MEMORY_LIMIT=40,LOUIS_HISTORY_LIMIT=24" \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --port=8080

      - name: Publish service information
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestReadyRevisionName)')"
          test -n "${URL}"
          test -n "${REVISION}"
          {
            echo "## Louis OS chat v6"
            echo "- URL: ${URL}"
            echo "- Revision: ${REVISION}"
            echo "- Persistent sessions: Firestore"
            echo "- Live worker state: Firestore louis_runtime/current"
            echo "- Deterministic interactive web research: enabled"
            echo "- Evidence collection: louis_web_evidence"
            echo "- False denial fallback: enabled"
            echo "- Authentication: none"
          } >> "$GITHUB_STEP_SUMMARY"
