name: Deploy Louis OS Chat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "atlas/louis_chat.py"
      - ".github/workflows/deploy-louis-chat.yml"
      - "Dockerfile"
      - "pyproject.toml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: louis-os-chat-production
  cancel-in-progress: false

env:
  PROJECT_ID: test-bot-499814
  REGION: europe-west1
  SERVICE: louis-os-chat

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build chat image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="gcr.io/${PROJECT_ID}/louis-os-chat:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          BUILD_ID="$(gcloud builds submit --project="${PROJECT_ID}" --tag="${IMAGE}" --async --format='value(id)' .)"
          test -n "${BUILD_ID}"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "Build status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            [[ "${attempt}" -lt 90 ]] || exit 1
            sleep 10
          done

      - name: Deploy permanent-memory web chat
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SA="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          if [[ -z "${RUNTIME_SA}" ]]; then RUNTIME_SA="${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"; fi

          SECRET_FLAGS=(--set-secrets="LOUIS_CHAT_KEY=louis-chat-key:latest")
          if gcloud secrets describe telegram-bot-token --project="${PROJECT_ID}" >/dev/null 2>&1; then
            SECRET_FLAGS+=(--update-secrets="TELEGRAM_BOT_TOKEN=telegram-bot-token:latest")
          fi
          if gcloud secrets describe telegram-allowed-chat-id --project="${PROJECT_ID}" >/dev/null 2>&1; then
            SECRET_FLAGS+=(--update-secrets="TELEGRAM_ALLOWED_CHAT_ID=telegram-allowed-chat-id:latest")
          fi

          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --platform=managed \
            --image="${IMAGE}" \
            --command=python \
            --args=-m,atlas.louis_chat \
            --service-account="${RUNTIME_SA}" \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_LOCATION=${REGION},LOUIS_CHAT_MODEL=gemini-2.5-flash,LOUIS_MEMORY_LIMIT=40,LOUIS_HISTORY_LIMIT=24" \
            "${SECRET_FLAGS[@]}" \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --port=8080

      - name: Publish service information
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestReadyRevisionName)')"
          test -n "${URL}"
          test -n "${REVISION}"
          {
            echo "## Louis OS permanent-memory chat"
            echo "- URL: ${URL}"
            echo "- Revision: ${REVISION}"
            echo "- Mobile web chat: deployed"
            echo "- Persistent sessions: Firestore"
            echo "- Permanent memory: louis_permanent_memory"
            echo "- Conversation summaries: enabled"
            echo "- Telegram endpoint: ${URL}/telegram/webhook"
            echo "- Authentication: louis-chat-key from Secret Manager"
          } >> "$GITHUB_STEP_SUMMARY"
