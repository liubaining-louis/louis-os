name: Deploy Louis OS Chat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "atlas/louis_chat_v6.py"
      - "atlas/louis_chat_v7.py"
      - "atlas/louis_chat_v8.py"
      - "atlas/louis_mcp.py"
      - "atlas/autonomous_action_bridge.py"
      - "atlas/llm_router.py"
      - "atlas/web_gateway.py"
      - "atlas/louis_state.py"
      - ".github/workflows/deploy-louis-chat.yml"
      - "Dockerfile"
      - "pyproject.toml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: louis-os-chat-production
  cancel-in-progress: false

env:
  PROJECT_ID: test-bot-499814
  REGION: europe-west1
  SERVICE: louis-os-chat

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build chat image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="gcr.io/${PROJECT_ID}/louis-os-chat:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          BUILD_ID="$(gcloud builds submit --project="${PROJECT_ID}" --tag="${IMAGE}" --async --format='value(id)' .)"
          test -n "${BUILD_ID}"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "Build status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            [[ "${attempt}" -lt 90 ]] || exit 1
            sleep 10
          done

      - name: Deploy chat with live GitHub synchronization
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SA="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          if [[ -z "${RUNTIME_SA}" ]]; then RUNTIME_SA="${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"; fi

          SECRET_FLAGS=()
          if gcloud secrets describe openrouter-api-key --project="${PROJECT_ID}" >/dev/null 2>&1; then
            SECRET_FLAGS+=(--update-secrets="OPENROUTER_API_KEY=openrouter-api-key:latest")
          fi
          if gcloud secrets describe groq-api-key --project="${PROJECT_ID}" >/dev/null 2>&1; then
            SECRET_FLAGS+=(--update-secrets="GROQ_API_KEY=groq-api-key:latest")
          fi
          if gcloud secrets describe github-runtime-token --project="${PROJECT_ID}" >/dev/null 2>&1; then
            SECRET_FLAGS+=(--update-secrets="LOUIS_GITHUB_TOKEN=github-runtime-token:latest")
          else
            echo "::warning::Secret github-runtime-token is missing; chat will report local_fallback instead of claiming live GitHub state."
          fi

          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --platform=managed \
            --image="${IMAGE}" \
            --command=python \
            --args=-m,atlas.louis_chat_v8 \
            --service-account="${RUNTIME_SA}" \
            --allow-unauthenticated \
            --remove-secrets=LOUIS_CHAT_KEY \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_LOCATION=${REGION},LOUIS_GEMINI_MODEL=gemini-2.5-flash,LOUIS_QWEN_MODEL=qwen/qwen3-30b-a3b-instruct-2507,LOUIS_GROQ_MODEL=llama-3.3-70b-versatile,LOUIS_MEMORY_LIMIT=40,LOUIS_HISTORY_LIMIT=24,LOUIS_PROVIDER_TIMEOUT=45,LOUIS_CODEX_PAIRING_TTL_DAYS=30,LOUIS_GITHUB_REPOSITORY=liubaining-louis/louis-os,LOUIS_GITHUB_BRANCH=main,LOUIS_GITHUB_TIMEOUT=12" \
            "${SECRET_FLAGS[@]}" \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --port=8080

      - name: Publish service information
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.latestReadyRevisionName)')"
          test -n "${URL}"
          test -n "${REVISION}"

          ANON_CODE="$(curl --silent --show-error --output /tmp/mcp-anonymous.json --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' \
            "${URL}/mcp")"
          [[ "${ANON_CODE}" == "401" ]]

          PAIRING="$(curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/json' \
            --data '{}' "${URL}/v1/codex/pair")"
          TOKEN="$(jq -er '.token' <<<"${PAIRING}")"
          test "${#TOKEN}" -ge 32
          INITIALIZE="$(curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer ${TOKEN}" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' \
            "${URL}/mcp")"
          jq -e '.result.serverInfo.name == "louis-os-mentor"' <<<"${INITIALIZE}"
          TOOLS="$(curl --fail-with-body --silent --show-error \
            -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer ${TOKEN}" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' "${URL}/mcp")"
          jq -e '.result.tools | length == 4' <<<"${TOOLS}"

          STATUS="$(curl --fail-with-body --silent --show-error "${URL}/v1/status")"
          jq -e '.state.data_freshness.mode == "github_live" or .state.data_freshness.mode == "local_fallback"' <<<"${STATUS}"
          jq -e '.state.github.repository == "liubaining-louis/louis-os"' <<<"${STATUS}"
          if jq -e '.state.data_freshness.mode == "local_fallback"' <<<"${STATUS}" >/dev/null; then
            echo "::warning::Deployment is healthy but GitHub live synchronization is not authenticated. Create Secret Manager secret github-runtime-token."
          fi

          {
            echo "## Louis OS chat v8 + live GitHub state"
            echo "- URL: ${URL}"
            echo "- Revision: ${REVISION}"
            echo "- GitHub repository: liubaining-louis/louis-os"
            echo "- GitHub synchronization mode: $(jq -r '.state.data_freshness.mode' <<<"${STATUS}")"
            echo "- GitHub checked at: $(jq -r '.state.data_freshness.checked_at' <<<"${STATUS}")"
            echo "- Autonomous ownership after approval: enabled"
            echo "- Gemini/Qwen/Groq router: enabled when configured"
            echo "- Codex MCP smoke test: passed"
          } >> "$GITHUB_STEP_SUMMARY"
