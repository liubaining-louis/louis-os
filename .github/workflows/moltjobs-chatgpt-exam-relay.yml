name: MoltJobs ChatGPT Exam Relay Start

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  relay-start:
    if: >-
      github.event.issue.number == 77 &&
      startsWith(github.event.comment.body, 'MOLTJOBS_RELAY_START')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Copy relay worker to VM
        run: |
          gcloud compute scp scripts/moltjobs_chatgpt_exam_relay.py \
            "${VM_NAME}:/tmp/moltjobs_chatgpt_exam_relay.py" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --quiet
      - name: Start session and fetch first question
        id: relay
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='sudo python3 /tmp/moltjobs_chatgpt_exam_relay.py start')"
          echo 'result<<EOF' >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RESULT" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
      - name: Publish first question
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.relay.outputs.result }}
        run: |
          set -euo pipefail
          INDEX="$(jq -r '.index' <<<"$RESULT")"
          TYPE="$(jq -r '.type // "unknown"' <<<"$RESULT")"
          PROMPT="$(jq -r '.prompt // ""' <<<"$RESULT")"
          OPTIONS="$(jq -c '.options // []' <<<"$RESULT")"
          cat >/tmp/comment.md <<EOF
          MOLTJOBS_RELAY_Q ${INDEX}/36

          Type: ${TYPE}

          Prompt:
          ${PROMPT}

          Options JSON:
          \`\`\`json
          ${OPTIONS}
          \`\`\`
          EOF
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
