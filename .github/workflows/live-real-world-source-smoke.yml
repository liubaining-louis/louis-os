name: Live real-world source smoke

on:
  pull_request:
    paths:
      - "atlas/real_world_sources.py"
      - "atlas/opportunity_discovery.py"
      - "scripts/live_real_world_source_smoke.py"
      - "tests/fixtures/live_opportunity_feed.json"
      - ".github/workflows/live-real-world-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Fetch, gate and rank live opportunity feed
        env:
          ATLAS_LIVE_FEED_URL: https://raw.githubusercontent.com/liubaining-louis/louis-os/test/live-real-world-source-smoke/tests/fixtures/live_opportunity_feed.json
        run: python scripts/live_real_world_source_smoke.py
