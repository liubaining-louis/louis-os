name: VM GitHub Cross-Repo Actuation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vm-github-cross-repo-actuation.yml'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  probe-and-fork:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Probe persistent GitHub identities and fork bounty repo
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/cross-repo.sh <<'REMOTE'
          set -euo pipefail
          echo "HOST=$(hostname)"
          echo "GH_BIN=$(command -v gh || true)"
          if ! command -v gh >/dev/null 2>&1; then
            echo 'GH_NOT_INSTALLED'
            exit 20
          fi

          selected=''
          for u in root $(find /home -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null); do
            if id "$u" >/dev/null 2>&1; then
              login="$(sudo -u "$u" -H gh api user --jq .login 2>/dev/null || true)"
              if [[ -n "$login" ]]; then
                echo "AUTHENTICATED_USER=$u"
                echo "GITHUB_LOGIN=$login"
                selected="$u"
                break
              fi
            fi
          done

          if [[ -z "$selected" ]]; then
            echo 'NO_PERSISTENT_GITHUB_AUTH'
            exit 21
          fi

          echo "SELECTED_VM_USER=$selected"
          set +e
          fork_out="$(sudo -u "$selected" -H gh repo fork Nexussyn/ai-growth-engine --clone=false --remote=false 2>&1)"
          rc=$?
          set -e
          echo "FORK_RC=$rc"
          echo "$fork_out" | sed -E 's/(gh[opusr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)/[REDACTED]/g'

          login="$(sudo -u "$selected" -H gh api user --jq .login)"
          if sudo -u "$selected" -H gh repo view "$login/ai-growth-engine" --json nameWithOwner,url --jq '.nameWithOwner+" "+.url' >/tmp/fork-view 2>/dev/null; then
            echo -n 'FORK_VERIFIED='; cat /tmp/fork-view
            exit 0
          fi
          exit "$rc"
          REMOTE
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='sudo bash -s' < /tmp/cross-repo.sh | tee /tmp/cross-repo.log
      - name: Publish result to issue 77
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## VM cross-repo GitHub actuation probe'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            tail -n 120 /tmp/cross-repo.log 2>/dev/null || true
            echo '```'
          } >/tmp/comment.md
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
