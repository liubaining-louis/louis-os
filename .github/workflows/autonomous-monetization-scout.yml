name: Autonomous monetization scout

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: autonomous-monetization-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Firestore dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-cloud-firestore

      - name: Verify runtime imports
        run: python -c "from google.cloud import firestore; print('Firestore import OK')"

      - name: Search and score public opportunities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/autonomous_monetization_scout.py

      - name: Consume explicit owner approvals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ATLAS_APPROVAL_ISSUE: "77"
        run: python scripts/autonomous_approval_manager.py

      - name: Start approved safe execution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ATLAS_EXECUTION_MIN_SCORE: "60"
        run: python scripts/autonomous_opportunity_executor.py

      - name: Execute approved external action with receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATLAS_EXTERNAL_GITHUB_TOKEN: ${{ secrets.ATLAS_EXTERNAL_GITHUB_TOKEN }}
        run: python scripts/autonomous_external_action_executor.py

      - name: Commit evidence ledger
        run: |
          if [ -z "$(git status --porcelain -- results/)" ]; then
            echo "No ledger changes"
            exit 0
          fi
          git config user.name "louis-os[bot]"
          git config user.email "louis-os[bot]@users.noreply.github.com"
          git add -f \
            results/monetization.json \
            results/monetization_candidates.json \
            results/monetization_experiments.jsonl \
            results/evidence.jsonl \
            results/opportunity_execution_receipts.json \
            results/external_action_queue.json \
            results/external_action_receipts.json \
            results/action_approvals.json \
            results/candidate_dossiers.json
          if git diff --cached --quiet; then
            echo "No staged ledger changes"
            exit 0
          fi
          git commit -m "Record autonomous monetization execution cycle"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Publish concise report to issue 77
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json
          from pathlib import Path
          data = json.loads(Path('results/monetization_candidates.json').read_text())
          ledger = json.loads(Path('results/monetization.json').read_text())
          approvals_path = Path('results/action_approvals.json')
          approvals = json.loads(approvals_path.read_text()) if approvals_path.exists() else {'approvals': []}
          top = (data.get('candidates') or [None])[0]
          print('Louis OS recherche, consomme les validations et n’annonce une action externe qu’avec un reçu vérifiable.')
          print()
          print(f"- Revenu encaissé : {ledger.get('revenue_confirmed_eur', 0)} €")
          print(f"- Opportunités qualifiées : {data.get('count', 0)}")
          print(f"- Validations persistées : {len(approvals.get('approvals', []))}")
          print(f"- Actions internes d’exécution : {ledger.get('internal_execution_actions', 0)}")
          print(f"- Soumissions externes vérifiées : {ledger.get('external_actions_submitted', 0)}")
          print(f"- État d’exécution : {ledger.get('execution_status', 'inconnu')}")
          if top:
              print(f"- Meilleure piste : [{top['title']}]({top['url']}) — score {top['score']}/100")
          issue = ledger.get('current_execution_issue')
          if issue:
              print(f"- Travail actif : {issue}")
          receipt = ledger.get('last_external_action_receipt')
          if receipt:
              print(f"- Reçu externe vérifié : {receipt}")
          print(f"- Prochaine action : {ledger.get('next_action', 'Continuer la recherche')}")
          PY
          gh issue comment 77 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/report.md
