name: Manic Superteam Final Submit

on:
  push:
    branches: [main]
    paths:
      - '.github/manic-superteam-submit-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Submit completed Manic report to Superteam
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >/tmp/submit_superteam.py <<'PY'
          import json, os
          from atlas.superteam_agent import listing_details, create_submission

          SLUG='dollar1000-usdc-manic-bug-bounty'
          api_key=(os.getenv('SUPERTEAM_API_KEY') or '').strip()
          if not api_key:
              print('SUPERTEAM_RESULT='+json.dumps({'submitted':False,'stage':'credentials','reason':'SUPERTEAM_API_KEY_missing'}))
              raise SystemExit(2)

          try:
              raw=listing_details(api_key,SLUG)
          except Exception as exc:
              print('SUPERTEAM_RESULT='+json.dumps({'submitted':False,'stage':'listing_details','slug':SLUG,'reason':str(exc)},ensure_ascii=False))
              raise SystemExit(3)

          candidates=[raw]
          for key in ('listing','data','item'):
              if isinstance(raw.get(key),dict): candidates.insert(0,raw[key])
          item=next((x for x in candidates if isinstance(x,dict) and (x.get('id') or x.get('listingId'))),{})
          listing_id=str(item.get('id') or item.get('listingId') or '')
          title=str(item.get('title') or item.get('name') or '')
          slug=str(item.get('slug') or SLUG)
          if not listing_id:
              print('SUPERTEAM_RESULT='+json.dumps({'submitted':False,'stage':'listing_details','slug':SLUG,'reason':'listing_id_missing','response_keys':list(raw.keys())},ensure_ascii=False))
              raise SystemExit(4)

          other_info='''The detailed single-bug report has already been submitted through the official Manic Typeform. Finding: UEFA Champions League: 2027 Champion multi-outcome market can render generic Team A / Team B labels and 0% probabilities instead of the actual competitors/probabilities. Targeted validation reproduced the issue 3/3. The earlier EPL hypothesis was excluded after evaluator correction. Supporting investigation and execution receipts are documented in Louis OS issue #322.'''
          try:
              receipt=create_submission(api_key,listing_id=listing_id,link='https://github.com/liubaining-louis/louis-os/issues/322',other_info=other_info,eligibility_answers=[])
          except Exception as exc:
              print('SUPERTEAM_RESULT='+json.dumps({'submitted':False,'stage':'create_submission','listing_id':listing_id,'listing_title':title,'listing_slug':slug,'reason':str(exc)},ensure_ascii=False))
              raise SystemExit(5)

          print('SUPERTEAM_RESULT='+json.dumps({'submitted':True,'stage':'create_submission','listing_id':listing_id,'listing_title':title,'listing_slug':slug,'receipt':receipt},ensure_ascii=False))
          PY
          ENC="$(base64 -w0 /tmp/submit_superteam.py)"
          set +e
          gcloud compute ssh "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}" --quiet --command="echo '${ENC}' | base64 -d | sudo docker exec -i louis-os-worker python -" | tee /tmp/superteam.log
          REMOTE_RC=${PIPESTATUS[0]}
          set -e
          grep '^SUPERTEAM_RESULT=' /tmp/superteam.log | tail -1 | sed 's/^SUPERTEAM_RESULT=//' >/tmp/result.json || true
          if [[ ! -s /tmp/result.json ]]; then
            printf '{"submitted":false,"stage":"remote_execution","reason":"no_structured_result","remote_rc":%s}\n' "$REMOTE_RC" >/tmp/result.json
          fi
          {
            echo '## Superteam final submission result'
            echo
            echo '```json'
            jq -c . /tmp/result.json
            echo '```'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >/tmp/comment.md
          gh issue comment 322 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          jq -e '.submitted == true' /tmp/result.json >/dev/null
