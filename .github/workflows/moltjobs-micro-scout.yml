name: MoltJobs Micro-Jobs Scout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moltjobs-micro-scout.yml'
      - 'scripts/moltjobs_micro_scout.py'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Copy scorer to VM
        run: gcloud compute scp scripts/moltjobs_micro_scout.py "${VM_NAME}:/tmp/moltjobs_micro_scout.py" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet
      - name: Scan live MoltJobs and inspect bidding syntax
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="sudo bash -c '
            set -euo pipefail
            export MOLT_NO_UPDATE_CHECK=1
            mkdir -p /var/lib/louis-os/state
            louis-molt jobs list --limit 100 --json > /tmp/moltjobs_jobs.json
            python3 /tmp/moltjobs_micro_scout.py
            echo ===BID_HELP===
            louis-molt bids --help || true
            echo ===BID_CREATE_HELP===
            louis-molt bids create --help || louis-molt bid --help || true
          '"
