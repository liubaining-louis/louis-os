name: Browser VM Smoke

on:
  workflow_run:
    workflows: ["Provision Louis OS VM"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Firestore client
        run: python -m pip install --disable-pip-version-check 'google-cloud-firestore>=2.21,<3'

      - name: Queue read-only Manic browser smoke command
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from google.cloud import firestore

          project = os.environ["PROJECT_ID"]
          run_id = os.environ.get("GITHUB_RUN_ID", "manual")
          command_id = f"browser-smoke-{run_id}"
          db = firestore.Client(project=project)
          ref = db.collection("louis_vm_commands").document(command_id)
          now = datetime.now(timezone.utc).isoformat()
          ref.set({
              "schema_version": "1.1",
              "command_id": command_id,
              "executor": "browser",
              "order": "browser_snapshot",
              "context": {
                  "url": "https://app.manic.trade/pm",
                  "timeout_ms": 30000,
                  "purpose": "post_deploy_read_only_browser_smoke",
              },
              "status": "queued",
              "created_at": now,
              "updated_at": now,
              "claimed_by": None,
              "outcome": None,
          }, merge=True)

          deadline = time.monotonic() + 120
          payload = {}
          while time.monotonic() < deadline:
              snap = ref.get()
              payload = snap.to_dict() or {}
              status = str(payload.get("status") or "")
              if status in {"completed", "blocked", "failed"}:
                  break
              time.sleep(3)
          else:
              status = "timeout"

          outcome = payload.get("outcome") if isinstance(payload.get("outcome"), dict) else {}
          result = outcome.get("result") if isinstance(outcome.get("result"), dict) else {}
          summary = {
              "command_id": command_id,
              "status": status,
              "reason": outcome.get("reason"),
              "final_url": result.get("final_url"),
              "title": result.get("title"),
              "http_status": result.get("http_status"),
              "evidence": outcome.get("evidence", []),
          }
          print("BROWSER_SMOKE=" + json.dumps(summary, ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("status=" + str(status) + "\n")
              handle.write("summary=" + json.dumps(summary, ensure_ascii=False).replace("\n", " ") + "\n")
          if status != "completed":
              raise SystemExit(1)
          PY

      - name: Publish browser smoke result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.smoke.outputs.status }}
          SUMMARY: ${{ steps.smoke.outputs.summary }}
        run: |
          gh issue comment 322 --repo "$GITHUB_REPOSITORY" --body "Persistent VM browser smoke: **${STATUS:-unknown}**. ${SUMMARY:-No structured result produced.} Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
