name: Report AI Option Trader Runs

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    if: startsWith(github.event.issue.title, 'AI Option Status:')
    runs-on: ubuntu-latest
    steps:
      - name: Report latest option trader runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-ai-option-trader-api.yml --limit 3 --json databaseId,status,conclusion,headSha,url,createdAt,event > /tmp/deploy-runs.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow diagnose-ai-option-trader-vm.yml --limit 3 --json databaseId,status,conclusion,headSha,url,createdAt,event > /tmp/diagnose-runs.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow fast-locate-ai-option-trader.yml --limit 3 --json databaseId,status,conclusion,headSha,url,createdAt,event > /tmp/fast-runs.json
          {
            echo '## Latest AI Option Trader runs'
            echo
            echo '### Deploy'
            echo '```json'; cat /tmp/deploy-runs.json; echo '```'
            echo
            echo '### Diagnose'
            echo '```json'; cat /tmp/diagnose-runs.json; echo '```'
            echo
            echo '### Fast locate'
            echo '```json'; cat /tmp/fast-runs.json; echo '```'
          } >/tmp/report.md
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
