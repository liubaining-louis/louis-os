name: Report AI Option Trader Runs

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    if: startsWith(github.event.issue.title, 'AI Option Status:')
    runs-on: ubuntu-latest
    steps:
      - name: Report latest option trader runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-ai-option-trader-7d.yml --limit 3 --json databaseId,status,conclusion,headSha,url,createdAt,event > /tmp/deploy7d.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-ai-option-trader-gemini.yml --limit 3 --json databaseId,status,conclusion,headSha,url,createdAt,event > /tmp/correct-deploy.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow inspect-ai-option-trader-model.yml --limit 3 --json databaseId,status,conclusion,headSha,url,createdAt,event > /tmp/inspect.json
          {
            echo '## Latest AI Option Trader runs'
            echo
            echo '### Verified 7D deploy'
            echo '```json'; cat /tmp/deploy7d.json; echo '```'
            echo
            echo '### Previous correct-VM deploy'
            echo '```json'; cat /tmp/correct-deploy.json; echo '```'
            echo
            echo '### Model inspection'
            echo '```json'; cat /tmp/inspect.json; echo '```'
          } >/tmp/report.md
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
