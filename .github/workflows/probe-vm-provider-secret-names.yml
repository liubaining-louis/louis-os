name: Probe VM provider secret names

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-vm-provider-secret-names.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: List secret filenames and env variable names only
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="sudo bash -c '
            set -euo pipefail
            echo ===SECRET_FILES===
            if [[ -d /var/lib/louis-os/secrets ]]; then
              find /var/lib/louis-os/secrets -maxdepth 1 -type f -printf "%f\n" | sort
            fi
            echo ===LIKELY_ENV_NAMES===
            for f in /etc/environment /etc/default/louis-os /etc/louis-os/env /var/lib/louis-os/.env /opt/louis-os/.env; do
              [[ -f \"$f\" ]] || continue
              sed -nE "s/^([A-Za-z_][A-Za-z0-9_]*)=.*/\\1/p" \"$f\" | grep -Ei "(GROQ|OPENAI|ANTHROPIC|GEMINI|LLM|API_KEY|MODEL)" || true
            done
            echo ===SYSTEMD_ENV_NAMES===
            systemctl show louis-os-worker.service -p Environment 2>/dev/null | sed -E "s/Environment=//" | tr " " "\n" | sed -nE "s/^([A-Za-z_][A-Za-z0-9_]*)=.*/\\1/p" | grep -Ei "(GROQ|OPENAI|ANTHROPIC|GEMINI|LLM|API_KEY|MODEL)" || true
          '"
