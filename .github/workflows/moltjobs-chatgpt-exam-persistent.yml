name: MoltJobs ChatGPT Exam Persistent Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  persistent-bridge:
    if: >-
      github.event.issue.number == 77 &&
      startsWith(github.event.comment.body, 'MOLTJOBS_RELAY_PERSIST_START')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Install relay worker and run complete interactive session
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          START_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail

          gcloud compute scp scripts/moltjobs_chatgpt_exam_relay.py \
            "${VM_NAME}:/tmp/moltjobs_chatgpt_exam_relay.py" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --quiet

          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LAST_ID="$START_COMMENT_ID"
          RESULT="$(gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet \
            --command='sudo python3 /tmp/moltjobs_chatgpt_exam_relay.py start')"

          publish_result() {
            local result="$1"
            local status
            status="$(jq -r '.status' <<<"$result")"
            if [[ "$status" == 'finished' ]]; then
              local answered report
              answered="$(jq -r '.answered // 0' <<<"$result")"
              report="$(jq -c '.report // {}' <<<"$result")"
              cat >/tmp/comment.md <<EOF
          MOLTJOBS_RELAY_FINISHED

          Answered: ${answered}

          Report:
          \`\`\`json
          ${report}
          \`\`\`
          EOF
            else
              local index type prompt options
              index="$(jq -r '.index' <<<"$result")"
              type="$(jq -r '.type // "unknown"' <<<"$result")"
              prompt="$(jq -r '.prompt // ""' <<<"$result")"
              options="$(jq -c '.options // []' <<<"$result")"
              cat >/tmp/comment.md <<EOF
          MOLTJOBS_RELAY_Q ${index}/36

          Type: ${type}

          Prompt:
          ${prompt}

          Options JSON:
          \`\`\`json
          ${options}
          \`\`\`
          EOF
            fi
            gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          }

          publish_result "$RESULT"

          for round in $(seq 1 36); do
            ANSWER_BODY=""
            ANSWER_ID=""
            for poll in $(seq 1 55); do
              JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/77/comments?since=${STARTED_AT}&per_page=100")"
              ANSWER_JSON="$(jq --argjson last "$LAST_ID" '[.[] | select(.id > $last and (.body | startswith("MOLTJOBS_RELAY_ANSWER:")))] | sort_by(.id) | .[0] // empty' <<<"$JSON")"
              if [[ -n "$ANSWER_JSON" ]]; then
                ANSWER_ID="$(jq -r '.id' <<<"$ANSWER_JSON")"
                ANSWER_BODY="$(jq -r '.body' <<<"$ANSWER_JSON")"
                break
              fi

              if (( poll % 10 == 0 )); then
                gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet \
                  --command='sudo python3 /tmp/moltjobs_chatgpt_exam_relay.py heartbeat >/dev/null' || true
              fi
              sleep 1
            done

            if [[ -z "$ANSWER_BODY" ]]; then
              gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body 'MOLTJOBS_RELAY_ERROR: timed out waiting for ChatGPT answer.'
              exit 1
            fi

            LAST_ID="$ANSWER_ID"
            ANSWER="${ANSWER_BODY#MOLTJOBS_RELAY_ANSWER:}"
            ANSWER_B64="$(printf '%s' "$ANSWER" | base64 -w0)"
            CMD="sudo python3 /tmp/moltjobs_chatgpt_exam_relay.py answer --answer-b64 '$ANSWER_B64'"
            RESULT="$(gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="$CMD")"
            publish_result "$RESULT"

            if [[ "$(jq -r '.status' <<<"$RESULT")" == 'finished' ]]; then
              exit 0
            fi
          done

          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body 'MOLTJOBS_RELAY_ERROR: safety round cap reached.'
          exit 1
