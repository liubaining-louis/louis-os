name: Inspect AI Option Eval Prereqs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-ai-option-eval-prereqs.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: test-bot-499814
      ZONE: europe-central2-a
      VM_NAME: gemini12345
      STATUS_ISSUE: '447'
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect training and data pipeline
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/inspect-eval.sh <<'REMOTE'
          set -u
          APP=/home/liubaining/AI-Option-Trader
          cd "$APP"
          echo '=== FILES ==='
          find . -maxdepth 3 -type f \( -name '*.csv' -o -name '*.parquet' -o -name '*.json' -o -name '*.py' \) -printf '%p %s bytes\n' | sort
          echo '=== TRAIN_PPO ==='
          sed -n '1,240p' train_ppo.py
          echo '=== PREPARE_DATA ==='
          sed -n '1,280p' prepare_data.py
          echo '=== OPTION_GYM ==='
          sed -n '1,360p' envs/option_gym.py
          echo '=== MODEL ==='
          ./venv/bin/python - <<'PY'
          from stable_baselines3 import PPO
          m=PPO.load('models/ppo_option_model.zip', device='cpu')
          print('obs=',m.observation_space)
          print('action=',m.action_space)
          PY
          REMOTE
          gcloud compute ssh "$VM_NAME" --project="$PROJECT_ID" --zone="$ZONE" --quiet --command='sudo -u liubaining -H bash -s' < /tmp/inspect-eval.sh | tee /tmp/inspect-eval.log
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## PPO evaluation prerequisites'; echo; echo '```text'; cat /tmp/inspect-eval.log 2>/dev/null || true; echo '```'; } >/tmp/report.md
          gh issue comment "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md

# evaluation inspection trigger
