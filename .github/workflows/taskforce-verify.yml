name: TaskForce Verify Agent

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/taskforce-market'
    paths:
      - '.github/workflows/taskforce-verify.yml'
      - 'scripts/taskforce_verify.sh'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Solve deterministic TaskForce verification and recheck inventory
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='sudo bash -s' < scripts/taskforce_verify.sh | tee /tmp/taskforce-verify.log
      - name: Publish bounded evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## TaskForce verification + inventory check'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'The solver only handles deterministic arithmetic/text-transform challenges and fails closed on unknown prompt shapes. API keys remain VM-local.'
            echo
            echo '```text'
            tail -n 180 /tmp/taskforce-verify.log 2>/dev/null || true
            echo '```'
          } >/tmp/comment.md
          gh issue comment 285 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
