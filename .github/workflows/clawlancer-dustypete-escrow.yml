name: Clawlancer DustyPete Escrow Explainer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clawlancer-dustypete-escrow.yml'
      - 'scripts/clawlancer_escrow_explainer_bounty.sh'
      - 'deliverables/clawlancer_escrow_explainer/**'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  execute:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify deliverable constraints
        shell: bash
        run: |
          set -euo pipefail
          words=$(tail -n +3 deliverables/clawlancer_escrow_explainer/README.md | wc -w)
          echo "DELIVERABLE_WORDS=$words"
          test "$words" -lt 200
          grep -qi 'magic toy box' deliverables/clawlancer_escrow_explainer/README.md
          grep -qi 'payment' deliverables/clawlancer_escrow_explainer/README.md
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Revalidate, claim and deliver live bounty
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='sudo bash -s' < scripts/clawlancer_escrow_explainer_bounty.sh | tee /tmp/clawlancer-escrow.log
      - name: Publish bounded evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Clawlancer Dusty Pete escrow cycle'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'The deliverable was checked for the <200-word requirement before any claim attempt.'
            echo
            echo '```text'
            tail -n 320 /tmp/clawlancer-escrow.log 2>/dev/null || true
            echo '```'
          } >/tmp/comment.md
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
