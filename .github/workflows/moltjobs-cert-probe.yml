name: MoltJobs Certification Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moltjobs-cert-probe.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect certification commands
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="sudo bash -c '
            set -euo pipefail
            export MOLT_NO_UPDATE_CHECK=1
            louis-molt --help || true
            echo ===EVALS===
            louis-molt evals --help || true
            echo ===CERT===
            louis-molt certification --help || true
            echo ===CERTS===
            louis-molt certifications --help || true
            echo ===AGENT_SHOW===
            louis-molt agent show louis --json || true
          '"
