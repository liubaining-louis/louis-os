name: Manic Targeted Reproduction

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  reproduce:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.issue.number == 322 && contains(github.event.comment.body, '[RUN_MANIC_REPRO]'))
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build current main image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="gcr.io/${PROJECT_ID}/louis-os-worker:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          BUILD_ID="$(gcloud builds submit --project="${PROJECT_ID}" --tag="${IMAGE}" --async --format='value(id)' .)"
          test -n "${BUILD_ID}"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "Cloud Build: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            [[ "${attempt}" -lt 90 ]] || exit 1
            sleep 10
          done

      - name: Point production VM at current image and restart
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute instances add-metadata "${VM_NAME}" \
            --zone="${ZONE}" --project="${PROJECT_ID}" \
            --metadata "louis-os-image=${IMAGE}"
          gcloud compute instances reset "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}"
          for attempt in $(seq 1 48); do
            STATUS="$(gcloud compute instances describe "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}" --format='value(status)' 2>/dev/null || true)"
            echo "VM status: ${STATUS}"
            if [[ "${STATUS}" == "RUNNING" ]]; then
              sleep 45
              break
            fi
            sleep 5
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Firestore client
        run: python -m pip install --disable-pip-version-check 'google-cloud-firestore>=2.21,<3'

      - name: Queue targeted reproduction
        id: repro
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from google.cloud import firestore

          project = os.environ['PROJECT_ID']
          run_id = os.environ.get('GITHUB_RUN_ID', 'manual')
          command_id = f'manic-repro-{run_id}'
          db = firestore.Client(project=project)
          ref = db.collection('louis_vm_commands').document(command_id)
          now = datetime.now(timezone.utc).isoformat()
          ref.set({
              'schema_version': '1.1',
              'command_id': command_id,
              'executor': 'browser',
              'order': 'manic_market_repro',
              'context': {
                  'url': 'https://app.manic.trade/pm',
                  'timeout_ms': 30000,
                  'attempts': 2,
                  'targets': ['EPL: 2027 Champion', 'UEFA Champions League: 2027 Champion'],
                  'purpose': 'issue_322_targeted_read_only_reproduction',
              },
              'status': 'queued',
              'created_at': now,
              'updated_at': now,
              'claimed_by': None,
              'outcome': None,
          }, merge=True)

          deadline = time.monotonic() + 240
          payload = {}
          status = 'timeout'
          while time.monotonic() < deadline:
              snap = ref.get()
              payload = snap.to_dict() or {}
              status = str(payload.get('status') or '')
              if status in {'completed', 'blocked', 'failed'}:
                  break
              time.sleep(3)

          outcome = payload.get('outcome') if isinstance(payload.get('outcome'), dict) else {}
          result = outcome.get('result') if isinstance(outcome.get('result'), dict) else {}
          summary = {
              'command_id': command_id,
              'status': status,
              'reason': outcome.get('reason'),
              'verdict': result.get('verdict'),
              'targets': result.get('targets'),
              'evidence': outcome.get('evidence', []),
              'diagnosis': outcome.get('diagnosis'),
          }
          text = json.dumps(summary, ensure_ascii=False)
          print('MANIC_REPRO=' + text)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('status=' + status + '\n')
              handle.write('summary=' + text.replace('\n', ' ') + '\n')
          if status != 'completed':
              raise SystemExit(1)
          PY

      - name: Publish reproduction result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.repro.outputs.status }}
          SUMMARY: ${{ steps.repro.outputs.summary }}
        run: |
          gh issue comment 322 --repo "$GITHUB_REPOSITORY" --body "## Manic targeted reproduction result\n\nStatus: **${STATUS:-unknown}**\n\n\`${SUMMARY:-No structured result produced.}\`\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
