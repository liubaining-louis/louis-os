name: Manic Targeted Reproduction

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/manic-repro-trigger.txt'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  reproduce:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.issue.number == 322 && contains(github.event.comment.body, '[RUN_MANIC_REPRO]')) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Build current main image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="gcr.io/${PROJECT_ID}/louis-os-worker:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          BUILD_ID="$(gcloud builds submit --project="${PROJECT_ID}" --tag="${IMAGE}" --async --format='value(id)' .)"
          test -n "${BUILD_ID}"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "Cloud Build: ${STATUS}"
            case "${STATUS}" in SUCCESS) break ;; FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;; esac
            [[ "${attempt}" -lt 90 ]] || exit 1
            sleep 10
          done
      - name: Force exact image cutover on production VM
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${IMAGE}" >/tmp/louis-image.txt
          gcloud compute scp /tmp/louis-image.txt "${VM_NAME}:/tmp/louis-image.txt" --zone="${ZONE}" --project="${PROJECT_ID}" --quiet
          gcloud compute ssh "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}" --quiet --command="sudo bash -s" <<'REMOTE'
          set -euo pipefail
          IMAGE="$(cat /tmp/louis-image.txt)"
          TOKEN="$(curl -fsS -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          echo "${TOKEN}" | docker login -u oauth2accesstoken --password-stdin https://gcr.io >/dev/null
          unset TOKEN
          systemctl stop louis-os-vm-first.service || true
          docker rm -f louis-os-worker louis-os-browser-monitor louis-os-tutor-bridge louis-os-crypto-monitor >/dev/null 2>&1 || true
          docker pull "${IMAGE}"
          docker run --rm "${IMAGE}" sh -lc "grep -q 'manic_market_repro' /app/atlas/browser_executor.py"
          docker run --rm "${IMAGE}" cat /app/scripts/vm_first_supervisor.sh >/usr/local/bin/louis-os-vm-first-supervisor
          chmod 755 /usr/local/bin/louis-os-vm-first-supervisor
          sed -i "s#^Environment=LOUIS_IMAGE=.*#Environment=LOUIS_IMAGE=${IMAGE}#" /etc/systemd/system/louis-os-vm-first.service
          systemctl daemon-reload
          systemctl start louis-os-vm-first.service
          for attempt in $(seq 1 36); do
            RUNNING_IMAGE="$(docker inspect -f '{{.Config.Image}}' louis-os-worker 2>/dev/null || true)"
            if [[ "${RUNNING_IMAGE}" == "${IMAGE}" ]]; then
              docker exec louis-os-worker sh -lc "grep -q 'manic_market_repro' /app/atlas/browser_executor.py"
              exit 0
            fi
            sleep 5
          done
          exit 1
          REMOTE
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Firestore client
        run: python -m pip install --disable-pip-version-check 'google-cloud-firestore>=2.21,<3'
      - name: Queue targeted reproduction
        id: repro
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from google.cloud import firestore
          project=os.environ['PROJECT_ID']; run_id=os.environ.get('GITHUB_RUN_ID','manual'); command_id=f'manic-repro-{run_id}'
          db=firestore.Client(project=project); ref=db.collection('louis_vm_commands').document(command_id); now=datetime.now(timezone.utc).isoformat()
          ref.set({'schema_version':'1.1','command_id':command_id,'executor':'browser','order':'manic_market_repro','context':{'url':'https://app.manic.trade/pm','timeout_ms':30000,'attempts':3,'targets':['UEFA Champions League: 2027 Champion'],'purpose':'issue_322_uefa_three_attempt_validation'},'status':'queued','created_at':now,'updated_at':now,'claimed_by':None,'outcome':None},merge=True)
          deadline=time.monotonic()+300; payload={}; status='timeout'
          while time.monotonic()<deadline:
            payload=ref.get().to_dict() or {}; status=str(payload.get('status') or '')
            if status in {'completed','blocked','failed'}: break
            time.sleep(3)
          outcome=payload.get('outcome') if isinstance(payload.get('outcome'),dict) else {}; result=outcome.get('result') if isinstance(outcome.get('result'),dict) else {}
          summary={'command_id':command_id,'status':status,'reason':outcome.get('reason'),'verdict':result.get('verdict'),'targets':result.get('targets'),'evidence':outcome.get('evidence',[]),'diagnosis':outcome.get('diagnosis')}
          text=json.dumps(summary,ensure_ascii=False); print('MANIC_REPRO='+text)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h: h.write('status='+status+'\n'); h.write('summary='+text.replace('\n',' ')+'\n')
          if status!='completed': raise SystemExit(1)
          PY
      - name: Publish reproduction result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.repro.outputs.status }}
          SUMMARY: ${{ steps.repro.outputs.summary }}
        run: |
          gh issue comment 322 --repo "$GITHUB_REPOSITORY" --body "## Manic UEFA 3-attempt validation result\n\nStatus: **${STATUS:-unknown}**\n\n\`${SUMMARY:-No structured result produced.}\`\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
