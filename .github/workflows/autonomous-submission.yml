name: Legacy autonomous submission diagnostic

# Superseded by autonomous-tested-submission.yml. Kept manual-only for bounded
# recovery/debugging; it must not compete with the production ledger writer.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: legacy-autonomous-submission-manual
  cancel-in-progress: false

jobs:
  submit-and-maintain:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Louis OS
        run: python -m pip install .

      - name: Validate submission engine
        run: |
          python -m unittest tests.test_external_github_auth -v
          python -m unittest tests.test_autonomous_submission -v
          python -m unittest tests.test_submission_monitor -v
          python -m unittest tests.test_production_policy -v

      - name: Build or diagnose the submission package
        run: python scripts/autonomous_submission_package_builder.py

      - name: Submit a tested repository patch when ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOUIS_GITHUB_PAT: ${{ secrets.LOUIS_GITHUB_PAT }}
          ATLAS_EXTERNAL_GITHUB_TOKEN: ${{ secrets.ATLAS_EXTERNAL_GITHUB_TOKEN }}
        run: python scripts/autonomous_pull_request_submitter.py

      - name: Monitor current pull request and derive next action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOUIS_GITHUB_PAT: ${{ secrets.LOUIS_GITHUB_PAT }}
          ATLAS_EXTERNAL_GITHUB_TOKEN: ${{ secrets.ATLAS_EXTERNAL_GITHUB_TOKEN }}
        run: python scripts/autonomous_submission_monitor.py

      - name: Persist submission evidence
        run: |
          if [ -z "$(git status --porcelain -- results/)" ]; then
            echo "No submission state changes"
            exit 0
          fi
          git config user.name "louis-os[bot]"
          git config user.email "louis-os[bot]@users.noreply.github.com"
          for path in \
            results/monetization.json \
            results/submission_package.json \
            results/submission_receipts.json \
            results/submission_diagnosis.json \
            results/submission_monitor.json; do
            if [ -e "$path" ]; then
              git add -f "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No staged submission changes"
            exit 0
          fi
          git commit -m "Record manual legacy submission diagnostic"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
