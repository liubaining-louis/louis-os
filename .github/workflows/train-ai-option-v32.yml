name: AI Option V3.2 Regime Observer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/train-ai-option-v32.yml'
      - 'ops/ai_option_v32/regime_brain_v32.py'
      - 'ops/ai_option_v32/regime_shadow_v32.py'

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: ai-option-v32-regime-observer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      PROJECT_ID: test-bot-499814
      ZONE: europe-central2-a
      VM_NAME: gemini12345
      STATUS_ISSUE: '452'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Copy V3.2 observer to VM
        run: |
          gcloud compute scp --quiet --project="$PROJECT_ID" --zone="$ZONE" \
            ops/ai_option_v32/regime_brain_v32.py \
            ops/ai_option_v32/regime_shadow_v32.py \
            "liubaining@$VM_NAME:/tmp/"
      - name: Freeze corrected observer and enable forward shadow
        run: |
          set -o pipefail
          gcloud compute ssh "liubaining@$VM_NAME" --project="$PROJECT_ID" --zone="$ZONE" --quiet \
            --ssh-flag='-o ServerAliveInterval=30' --ssh-flag='-o ServerAliveCountMax=6' \
            --command='sudo bash -s' <<'REMOTE' 2>&1 | tee /tmp/v32.log
          set -euo pipefail
          APP=/home/liubaining/AI-Option-Trader
          install -o liubaining -g liubaining -m 0644 /tmp/regime_brain_v32.py "$APP/regime_brain_v32.py"
          install -o liubaining -g liubaining -m 0644 /tmp/regime_shadow_v32.py "$APP/regime_shadow_v32.py"
          mkdir -p "$APP/models/v32" "$APP/data/v32" "$APP/logs/v32"
          chown -R liubaining:liubaining "$APP/models/v32" "$APP/data/v32" "$APP/logs/v32"
          cd "$APP"
          sudo -u liubaining -H ./venv/bin/python regime_brain_v32.py
          # Semantic labels changed before the genuine forward period begins; reset only the pre-freeze observer memory/log.
          rm -f "$APP/logs/v32/regime_memory.json" "$APP/logs/v32/regime_forward.jsonl"
          date -u +%FT%TZ > "$APP/models/v32/FORWARD_FREEZE_UTC.txt"
          chown -R liubaining:liubaining "$APP/models/v32" "$APP/logs/v32"
          cat >/etc/systemd/system/ai-option-v32-regime-shadow.service <<'UNIT'
          [Unit]
          Description=AI Option V3.2 regime forward shadow observer
          After=network-online.target
          [Service]
          Type=oneshot
          User=liubaining
          WorkingDirectory=/home/liubaining/AI-Option-Trader
          ExecStart=/home/liubaining/AI-Option-Trader/venv/bin/python /home/liubaining/AI-Option-Trader/regime_shadow_v32.py
          UNIT
          cat >/etc/systemd/system/ai-option-v32-regime-shadow.timer <<'UNIT'
          [Unit]
          Description=Run V3.2 regime observer after US close
          [Timer]
          OnCalendar=Mon..Fri *-*-* 22:40:00 Europe/Paris
          Persistent=true
          Unit=ai-option-v32-regime-shadow.service
          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now ai-option-v32-regime-shadow.timer
          systemctl start ai-option-v32-regime-shadow.service
          echo '=== V32 FREEZE ==='
          cat "$APP/models/v32/FORWARD_FREEZE_UTC.txt"
          echo '=== V32 CONFIG ==='
          cat "$APP/models/v32/regime_config.json"
          echo '=== V32 CURRENT STATE ==='
          cat "$APP/logs/v32/regime_state.json"
          echo '=== V32 TIMER ==='
          systemctl --no-pager status ai-option-v32-regime-shadow.timer | head -15 || true
          REMOTE
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## V3.2 Regime Observer final pre-forward freeze'; echo; echo '```text'; tail -n 500 /tmp/v32.log 2>/dev/null || true; echo '```'; } >/tmp/report.md
          gh issue comment "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
