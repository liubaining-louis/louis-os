name: Taskmarket Rooftop World Submission

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taskmarket-rooftop-world-submit.yml'
      - 'scripts/taskmarket_rooftop_world_video.py'
      - 'scripts/taskmarket_rooftop_world_build.sh'
      - 'scripts/taskmarket_rooftop_world_submit.sh'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Copy original generator to Louis VM
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute scp \
            scripts/taskmarket_rooftop_world_video.py \
            "${VM_NAME}:/tmp/taskmarket_rooftop_world_video.py" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --quiet

      - name: Build and validate MP4 before external action
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --quiet \
            --command='sudo bash -s' \
            < scripts/taskmarket_rooftop_world_build.sh | tee /tmp/taskmarket-rooftop-build.log

      - name: Submit zero-stake worker action and independently verify receipt
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --quiet \
            --command='sudo bash -s' \
            < scripts/taskmarket_rooftop_world_submit.sh | tee /tmp/taskmarket-rooftop-submit.log

      - name: Publish bounded evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Taskmarket — World of Base 2030 rooftop-world submission'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'Target: Taskmarket bounty `0xb4e0e2150a5b69a781769fe71f9092de3cffe978a03fd7286ebd408b99b152e3`.'
            echo 'Assigned lane: **2 — rooftop gardens above the city**.'
            echo 'Named style: **mid-century gouache cut-paper diorama**.'
            echo 'The MP4 and original audio are generated procedurally by Louis; no third-party art, music, real-person likeness, Base wordmark, or Coinbase wordmark is used.'
            echo 'Worker submission path is zero-stake and requiresPayment=false; Louis does not spend or transfer funds.'
            echo 'The Taskmarket encrypted keystore remains on the GCP VM.'
            echo
            echo '### Build validation'
            echo '```text'
            tail -n 120 /tmp/taskmarket-rooftop-build.log 2>/dev/null || true
            echo '```'
            echo
            echo '### External submission receipt'
            echo '```text'
            tail -n 180 /tmp/taskmarket-rooftop-submit.log 2>/dev/null || true
            echo '```'
          } >/tmp/comment.md
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
