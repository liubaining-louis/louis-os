name: Expanded cash-first history

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "atlas/expanded_market_sources.py"
      - "scripts/expanded_cash_first_cycle.py"
      - ".github/workflows/expanded-cash-first-history.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: monetization-ledger-writer
  cancel-in-progress: false

jobs:
  expand-preserve-and-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Louis OS
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Expand source mesh and preserve opportunity lifecycle
        run: python scripts/expanded_cash_first_cycle.py

      - name: Reclassify and rank expanded opportunities
        run: |
          python scripts/classify_software_micro_missions.py
          python scripts/enforce_delivery_compatibility.py
          python scripts/capability_market_cycle.py
          python scripts/prepare_simple_mission_dossiers.py
          python scripts/cash_first_market_postprocess.py
          python scripts/sync_cash_first_ledger.py

      - name: Persist expanded evidence atomically
        run: |
          git config user.name "louis-os[bot]"
          git config user.email "louis-os[bot]@users.noreply.github.com"
          for path in \
            results/universal_market_opportunities.json \
            results/universal_market_cycle.json \
            results/expanded_source_refresh.json \
            results/opportunity_history.json \
            results/software_micro_mission_classification.json \
            results/delivery_compatibility_receipt.json \
            results/capability_market.json \
            results/mission_clusters.json \
            results/revenue_simulation.json \
            results/capability_build_plan.json \
            results/capability_market_history.json \
            results/cluster_proposal_templates \
            results/simple_mission_dossier_receipts.json \
            results/simple_mission_dossiers \
            results/cash_first_market.json \
            results/human_action_required.json \
            results/monetization.json; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No expanded cash-first changes"
            exit 0
          fi
          git commit -m "Record expanded append-only cash-first cycle"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Publish retention and expansion status
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY' > /tmp/expanded-cash-first.md
          import json
          from pathlib import Path
          refresh = json.loads(Path("results/expanded_source_refresh.json").read_text())
          history = json.loads(Path("results/opportunity_history.json").read_text())
          cash = json.loads(Path("results/cash_first_market.json").read_text())
          ledger = json.loads(Path("results/monetization.json").read_text())
          print("Maintenant Louis OS conserve les opportunités disparues avec un statut explicite et recherche sur un maillage de catégories plus large.")
          print()
          print(f"- Catégories supplémentaires surveillées : {refresh.get('expanded_categories', 0)}")
          for source in refresh.get("sources", []):
              print(f"- {source.get('source_id')} : {source.get('observed_count', 0)} opportunité(s), statut `{source.get('status')}`")
          print(f"- Registre historique total : {history.get('count', 0)}")
          print(f"- Opportunités actives au dernier cycle : {history.get('active_count', 0)}")
          print(f"- Statuts conservés : {history.get('counts_by_status', {})}")
          print(f"- Cash-first courants : {cash.get('counts', {}).get('cash_first', 0)}")
          print(f"- Soumissions externes vérifiées : {ledger.get('external_actions_submitted', 0)}")
          print(f"- Revenu vérifié : {ledger.get('revenue_confirmed_eur', 0.0)} €")
          print("- Règle : aucune opportunité n'est supprimée silencieusement ; elle devient active, préparée, rejetée, non vue, expirée, fermée ou soumise.")
          PY
          gh issue comment 77 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/expanded-cash-first.md
