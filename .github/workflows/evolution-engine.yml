name: Louis OS Evolution Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "atlas/evolution_engine.py"
      - "atlas/self_diagnostic.py"
      - "atlas/improvement_planner.py"
      - "atlas/developer_agent.py"
      - "tests/test_evolution_engine.py"
      - "tests/test_developer_agent.py"
      - ".github/workflows/evolution-engine.yml"

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: louis-evolution-engine
  cancel-in-progress: false

jobs:
  diagnose-plan-and-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e .

      - name: Run deterministic tests
        run: python -m unittest tests.test_evolution_engine tests.test_developer_agent

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: test-bot-499814
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT || vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Run guarded evolution cycle
        env:
          GOOGLE_CLOUD_PROJECT: test-bot-499814
        run: python -m atlas.evolution_engine --firestore --print

      - name: Build and persist developer dossier
        id: developer
        run: |
          python -m atlas.developer_agent \
            --project-id test-bot-499814 \
            --github-output >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          from atlas.developer_agent import dossier_markdown
          dossier = json.loads(Path("results/developer_dossier_latest.json").read_text())
          Path("results/developer_issue.md").write_text(dossier_markdown(dossier), encoding="utf-8")
          PY

      - name: Create implementation issue once
        if: steps.developer.outputs.proposal_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_ID: ${{ steps.developer.outputs.proposal_id }}
          ISSUE_TITLE: ${{ steps.developer.outputs.issue_title }}
        run: |
          existing="$(gh issue list --state all --search "$PROPOSAL_ID in:body" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Implementation issue already exists: #$existing"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file results/developer_issue.md
          fi

      - name: Upload evolution evidence
        uses: actions/upload-artifact@v4
        with:
          name: evolution-cycle-${{ github.run_id }}
          path: |
            results/evolution_cycle_latest.json
            results/developer_dossier_latest.json
            results/developer_issue.md
          retention-days: 30
