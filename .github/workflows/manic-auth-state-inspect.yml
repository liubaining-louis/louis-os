name: Manic Auth State Inspect
on:
  push:
    branches: [main]
    paths: ['.github/manic-auth-state-trigger.txt']
permissions:
  contents: read
  id-token: write
  issues: write
env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect auth state without secrets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/authinspect.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          URL='https://app.manic.trade/pm'; PROFILE='/app/results/browser-profile'
          with sync_playwright() as p:
            ctx=p.chromium.launch_persistent_context(PROFILE,headless=True,args=['--no-sandbox','--disable-dev-shm-usage'],viewport={'width':1440,'height':1000})
            pg=ctx.pages[0] if ctx.pages else ctx.new_page(); pg.goto(URL,wait_until='domcontentloaded',timeout=30000); pg.wait_for_timeout(2500)
            body=(pg.locator('body').inner_text() or '')[:20000]
            controls=[]
            els=pg.locator('a,button,[role=button]')
            for i in range(min(els.count(),160)):
              e=els.nth(i)
              try:
                if not e.is_visible(): continue
                t=(e.inner_text() or e.get_attribute('aria-label') or '').strip()
                if t: controls.append(t[:200])
              except: pass
            cookie_names=sorted({c.get('name','') for c in ctx.cookies() if c.get('domain','').endswith('manic.trade')})
            storage_keys=[]
            try:
              storage_keys=pg.evaluate('Object.keys(localStorage)')
            except: pass
            markers=['login','logout','account','profile','deposit','portfolio','wallet','funds']
            marker_hits={m:(m in body.lower()) for m in markers}
            print('AUTHSTATE='+json.dumps({'url':pg.url,'title':pg.title(),'cookie_names':cookie_names,'local_storage_keys':storage_keys,'marker_hits':marker_hits,'controls':controls[:120]},ensure_ascii=False)); ctx.close()
          PY
          ENC=$(base64 -w0 /tmp/authinspect.py)
          gcloud compute ssh "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}" --quiet --command="sudo docker stop louis-os-browser-monitor >/dev/null 2>&1 || true; echo '${ENC}' | base64 -d | sudo docker exec -i louis-os-worker python -; sudo docker start louis-os-browser-monitor >/dev/null 2>&1 || true" | tee /tmp/auth.log
          grep '^AUTHSTATE=' /tmp/auth.log | tail -1 | sed 's/^AUTHSTATE=//' >/tmp/auth.json
          test -s /tmp/auth.json
          { echo '## Manic auth-state inspection (no secrets)'; echo; echo '```json'; cat /tmp/auth.json; echo; echo '```'; echo; echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; } >/tmp/comment.md
          gh issue comment 322 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
