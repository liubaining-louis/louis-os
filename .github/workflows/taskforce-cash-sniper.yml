name: TaskForce Cash Sniper

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/taskforce-cash-sniper.yml'
      - 'scripts/taskforce_cash_sniper.py'

permissions:
  contents: write
  id-token: write

concurrency:
  group: taskforce-cash-sniper-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Copy TaskForce cash sniper to VM
        run: gcloud compute scp scripts/taskforce_cash_sniper.py "${VM_NAME}:/tmp/taskforce_cash_sniper.py" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet

      - name: Scan, filter and apply on TaskForce
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="sudo bash -c '
            set -euo pipefail
            export TASKFORCE_MIN_BUDGET=5
            export TASKFORCE_MAX_BUDGET=50
            export TASKFORCE_MAX_APPLIES_PER_RUN=2
            python3 /tmp/taskforce_cash_sniper.py
          '" | tee /tmp/taskforce-cash-sniper.log

      - name: Pull sanitized market state from VM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet \
            --command='sudo cat /var/lib/louis-os/results/taskforce/cash_sniper_public.json' \
            > results/taskforce_market.json
          python -m json.tool results/taskforce_market.json >/dev/null

      - name: Persist TaskForce market state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "louis-os[bot]"
          git config user.email "louis-os[bot]@users.noreply.github.com"
          git add -f results/taskforce_market.json
          if git diff --cached --quiet; then
            echo "No TaskForce market state changes"
            exit 0
          fi
          git commit -m "Refresh TaskForce cash market"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "TaskForce write conflict on attempt ${attempt}; retrying"
            git rebase --abort || true
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done
          exit 1
