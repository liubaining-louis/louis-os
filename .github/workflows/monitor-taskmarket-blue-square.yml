name: Monitor Taskmarket Blue Square (superseded)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[workflow-policy-only]') }}
    concurrency:
      group: louis-os-single-execution
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Point to consolidated monitor
        run: |
          echo 'This single-claim monitor is retained for audit history only.'
          echo 'Use .github/workflows/monitor-taskmarket-claims.yml for all active Taskmarket claims.'
