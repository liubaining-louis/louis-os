name: External outcome reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"
  push:
    branches: [main]
    paths:
      - "atlas/external_outcome_reconciliation.py"
      - "scripts/reconcile_external_outcomes.py"
      - "tests/test_external_outcome_reconciliation.py"
      - "tests/test_external_outcome_probe.py"
      - ".github/workflows/external-outcome-reconciliation.yml"

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[workflow-policy-only]') }}
    concurrency:
      group: louis-os-single-execution
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Push-triggered runs can wait behind another ledger writer.  Read
          # the branch head at job start instead of replaying a stale event
          # snapshot over newer market results.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate outcome state transitions
        run: python -m unittest tests.test_external_outcome_reconciliation tests.test_external_outcome_probe -v

      - name: Reconcile public counterparty and wallet evidence
        id: outcome
        shell: bash
        run: |
          # Keep the structured result available for persistence before marking
          # an incomplete probe as failed at the end of the job.
          probe_exit=0
          python scripts/reconcile_external_outcomes.py > /tmp/external-outcome.json || probe_exit=$?
          cat /tmp/external-outcome.json
          jq -e '(.changed | type == "boolean") and (.health_changed | type == "boolean") and (.health.status | type == "string")' /tmp/external-outcome.json >/dev/null
          echo "changed=$(jq -r '.changed' /tmp/external-outcome.json)" >> "$GITHUB_OUTPUT"
          echo "health_changed=$(jq -r '.health_changed' /tmp/external-outcome.json)" >> "$GITHUB_OUTPUT"
          echo "health=$(jq -r '.health.status' /tmp/external-outcome.json)" >> "$GITHUB_OUTPUT"
          echo "probe_exit=$probe_exit" >> "$GITHUB_OUTPUT"
          jq -r '
            "## External outcome probe\n\n" +
            "- Health: **\(.health.status)**\n" +
            "- Checked: \(.checked_at)\n" +
            "- Sources read successfully: \(.health.sources_successful)/\(.health.sources_expected)\n" +
            "- Wallet evidence fresh: \(.wallet_evidence_fresh)\n" +
            "- Economic transition: \(.changed)\n\n" +
            (.errors | map("- " + .) | join("\n"))
          ' /tmp/external-outcome.json >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh diagnosis after a real transition
        if: steps.outcome.outputs.changed == 'true'
        run: |
          python scripts/analyze_monetization_root_cause.py
          python scripts/reflective_evolution_cycle.py

      - name: Persist meaningful outcome or health changes
        if: steps.outcome.outputs.changed == 'true' || steps.outcome.outputs.health_changed == 'true'
        shell: bash
        run: |
          git config user.name "louis-os[bot]"
          git config user.email "louis-os[bot]@users.noreply.github.com"
          git add -f \
            results/external_action_receipts.json \
            results/external_outcome_reconciliation.json \
            results/external_outcome_health.json \
            results/monetization.json \
            results/monetization_root_cause.json \
            results/reflective_evolution.json \
            results/reflective_evolution_history.json \
            results/monetization_experiments.jsonl \
            results/evidence.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "Record external outcome or probe health transition"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 3))
          done
          exit 1

      - name: Publish only a meaningful economic transition
        if: steps.outcome.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          jq -r '
            "## External outcome reconciled\n\n" +
            "- Probe health: **\(.health.status)**\n" +
            "- Wallet evidence fresh: **\(.wallet_evidence_fresh)**\n" +
            "- Accepted: **\(.accepted_count)**\n" +
            "- Payouts queued: **\(.payout_queued_count)** (\(.payout_queued_rtc) RTC)\n" +
            "- Payout receipts marked paid: **\(.payout_paid_count)**\n" +
            "- Official RTC wallet balances: `\(.wallet_balances_rtc)`\n\n" +
            "- RTC received since baseline: **\(.wallet_received_rtc)**\n" +
            "- Aggregate wallet settlement verified: **\(.aggregate_wallet_settlement_verified)**\n\n" +
            "Acceptance and queueing are not payment; RTC is not counted as EUR without verified liquidity."
          ' /tmp/external-outcome.json > /tmp/external-outcome.md
          gh issue comment 322 --repo "$GITHUB_REPOSITORY" --body-file /tmp/external-outcome.md

      - name: Preserve dated probe evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: external-outcome-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/external-outcome.json
            results/external_outcome_health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete external evidence reads
        if: steps.outcome.outputs.health != 'healthy' || steps.outcome.outputs.probe_exit != '0'
        shell: bash
        run: |
          echo "::error::External outcome probe is incomplete. See the job summary and dated artifact; historical receipts remain historical."
          exit 1
