name: Install MoltJobs encrypted key envelope on VM

on:
  push:
    branches: [main]
    paths:
      - 'ops/moltjobs_key_envelope.b64'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Transfer ciphertext and decrypt only on Louis VM
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/moltjobs_key_envelope.b64
          gcloud compute scp ops/moltjobs_key_envelope.b64 "${VM_NAME}:/tmp/moltjobs_key_envelope.b64" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="sudo bash -c '
            set -euo pipefail
            umask 077
            D=/var/lib/louis-os/secrets
            K=\$D/moltjobs_transport_rsa.pem
            P=\$D/moltjobs_transport_rsa.pub.pem
            OUT=\$(mktemp)
            trap \"rm -f \\\"\$OUT\\\" /tmp/moltjobs_key_envelope.b64\" EXIT
            test -s \$K
            base64 -d /tmp/moltjobs_key_envelope.b64 | openssl pkeyutl -decrypt -inkey \$K -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 > \$OUT
            grep -q \"^mj_live_\" \$OUT
            test \$(wc -c < \$OUT) -gt 20
            install -m 600 -o root -g root \$OUT \$D/moltjobs_api_key
            rm -f \$K \$P
            test -s \$D/moltjobs_api_key
            test \"\$(stat -c %a \$D/moltjobs_api_key)\" = 600
            echo MOLTJOBS_KEY_INSTALL=stored_securely
            echo MOLTJOBS_TRANSPORT_PRIVATE_KEY_DESTROYED=true
          '"
      - name: Verify MoltJobs authentication without exposing key
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="sudo env MOLT_NO_UPDATE_CHECK=1 louis-molt auth whoami --json"
