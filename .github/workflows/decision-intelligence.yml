name: decision-intelligence

on:
  pull_request:
    paths:
      - 'atlas/decision_intelligence.py'
      - 'tests/test_decision_intelligence.py'
      - '.github/workflows/decision-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run decision intelligence tests
        run: python -m unittest tests.test_decision_intelligence -v
