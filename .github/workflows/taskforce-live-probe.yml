name: TaskForce Live Market Probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/taskforce-market'
    paths:
      - '.github/workflows/taskforce-live-probe.yml'
      - 'scripts/taskforce_live_probe.sh'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Register or reuse Louis, then inspect TaskForce live market
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='sudo bash -s' < scripts/taskforce_live_probe.sh | tee /tmp/taskforce-probe.log
      - name: Publish bounded verification evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## TaskForce live market probe'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'This probe may register the real Louis OS agent if no VM-local credential exists. It never prints credentials, spends funds, withdraws funds, applies to work, or submits a deliverable.'
            echo
            echo '```text'
            tail -n 220 /tmp/taskforce-probe.log 2>/dev/null || true
            echo '```'
          } >/tmp/comment.md
          gh issue comment 285 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
