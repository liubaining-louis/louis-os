name: MoltJobs Certification Debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moltjobs-cert-debug.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read non-secret certification error only
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="sudo bash -c '
            set -euo pipefail
            echo ===CERT_STDERR===
            sed -n \"1,120p\" /var/lib/louis-os/state/moltjobs_general_fundamentals_stderr.log 2>/dev/null || true
            echo ===STATE_FILES===
            find /var/lib/louis-os/state -maxdepth 1 -type f -name \"moltjobs_*cert*\" -o -name \"moltjobs_general_fundamentals*\" | sort || true
          '"
