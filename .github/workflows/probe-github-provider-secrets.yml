name: Probe GitHub provider secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-github-provider-secrets.yml'

permissions:
  contents: read

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_KEY: ${{ secrets.GROQ_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in GROQ_API_KEY GROQ_KEY OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=PRESENT"
            else
              echo "$name=ABSENT"
            fi
          done
