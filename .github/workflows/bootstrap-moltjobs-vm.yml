name: Bootstrap proven income lanes on Louis VM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-moltjobs-vm.yml'
      - 'scripts/moltjobs_cash_sniper.py'
      - 'atlas/production_policy.py'
      - 'config/production_policy.json'
      - 'deploy/louis-moltjobs-cash-sniper.service'
      - 'deploy/louis-moltjobs-cash-sniper.timer'
      - 'scripts/taskforce_cash_sniper.py'
      - 'deploy/louis-taskforce-cash-sniper.service'
      - 'deploy/louis-taskforce-cash-sniper.timer'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Copy proven-income runtime to VM
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute scp \
            scripts/moltjobs_cash_sniper.py \
            scripts/taskforce_cash_sniper.py \
            atlas/production_policy.py \
            config/production_policy.json \
            deploy/louis-moltjobs-cash-sniper.service \
            deploy/louis-moltjobs-cash-sniper.timer \
            deploy/louis-taskforce-cash-sniper.service \
            deploy/louis-taskforce-cash-sniper.timer \
            "${VM_NAME}:/tmp/" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --quiet

      - name: Prepare MoltJobs CLI and least-privilege runtime on VM
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/bootstrap-moltjobs.sh <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          SECRET_DIR=/var/lib/louis-os/secrets
          KEY_FILE="$SECRET_DIR/moltjobs_api_key"
          WRAPPER=/usr/local/bin/louis-molt
          RUNTIME_USER=louis-os
          RUNTIME_GROUP=louis-runtime

          getent group "$RUNTIME_GROUP" >/dev/null || groupadd --system "$RUNTIME_GROUP"
          id -u "$RUNTIME_USER" >/dev/null 2>&1 || useradd --system --gid "$RUNTIME_GROUP" --home-dir /var/lib/louis-os --shell /usr/sbin/nologin "$RUNTIME_USER"

          install -d -m 710 -o root -g "$RUNTIME_GROUP" "$SECRET_DIR"
          install -d -m 770 -o "$RUNTIME_USER" -g "$RUNTIME_GROUP" /var/lib/louis-os/state /var/lib/louis-os/results /var/lib/louis-os/runtime /var/lib/louis-os/config
          install -m 0755 -o root -g "$RUNTIME_GROUP" /tmp/moltjobs_cash_sniper.py /var/lib/louis-os/runtime/moltjobs_cash_sniper.py
          install -m 0644 -o root -g "$RUNTIME_GROUP" /tmp/production_policy.py /var/lib/louis-os/runtime/production_policy.py
          install -m 0644 -o root -g "$RUNTIME_GROUP" /tmp/production_policy.json /var/lib/louis-os/config/production_policy.json
          install -m 0644 /tmp/louis-moltjobs-cash-sniper.service /etc/systemd/system/louis-moltjobs-cash-sniper.service
          install -m 0644 /tmp/louis-moltjobs-cash-sniper.timer /etc/systemd/system/louis-moltjobs-cash-sniper.timer
          install -m 0755 -o root -g "$RUNTIME_GROUP" /tmp/taskforce_cash_sniper.py /var/lib/louis-os/runtime/taskforce_cash_sniper.py
          install -m 0644 /tmp/louis-taskforce-cash-sniper.service /etc/systemd/system/louis-taskforce-cash-sniper.service
          install -m 0644 /tmp/louis-taskforce-cash-sniper.timer /etc/systemd/system/louis-taskforce-cash-sniper.timer

          if ! command -v node >/dev/null 2>&1 || [[ "$(node -p 'process.versions.node.split(`.`)[0]' 2>/dev/null || echo 0)" -lt 18 ]]; then
            apt-get update -qq
            apt-get install -y -qq nodejs npm >/dev/null
          fi

          NODE_MAJOR="$(node -p 'process.versions.node.split(`.`)[0]')"
          if [[ "$NODE_MAJOR" -lt 18 ]]; then
            echo "MOLTJOBS_BOOTSTRAP_ERROR=node_too_old:$NODE_MAJOR"
            exit 3
          fi

          npm install -g @moltjobs/cli >/dev/null 2>&1

          cat >"$WRAPPER" <<'WRAP'
          #!/usr/bin/env bash
          set -euo pipefail
          KEY_FILE=/var/lib/louis-os/secrets/moltjobs_api_key
          if [[ ! -s "$KEY_FILE" ]]; then
            echo 'MOLTJOBS_API_KEY_MISSING: store the authorized key in /var/lib/louis-os/secrets/moltjobs_api_key.' >&2
            exit 10
          fi
          export MOLTJOBS_API_KEY="$(tr -d '\r\n' < "$KEY_FILE")"
          exec molt "$@"
          WRAP
          chown root:root "$WRAPPER"
          chmod 755 "$WRAPPER"

          if [[ -e "$KEY_FILE" ]]; then
            chown root:"$RUNTIME_GROUP" "$KEY_FILE"
            chmod 640 "$KEY_FILE"
          fi

          systemctl daemon-reload
          systemctl enable --now louis-moltjobs-cash-sniper.timer >/dev/null
          systemctl enable --now louis-taskforce-cash-sniper.timer >/dev/null
          echo "MOLTJOBS_BOOTSTRAP_READY=true"
          echo "MOLTJOBS_VM_TIMER=$(systemctl is-active louis-moltjobs-cash-sniper.timer)"
          echo "TASKFORCE_VM_TIMER=$(systemctl is-active louis-taskforce-cash-sniper.timer)"
          echo "MOLTJOBS_NEXT_SCAN=$(systemctl list-timers louis-moltjobs-cash-sniper.timer --no-legend | tr -s ' ' | cut -c1-160)"
          echo "MOLTJOBS_RUNTIME_USER=$RUNTIME_USER"
          echo "MOLTJOBS_CLI_VERSION=$(molt --version 2>/dev/null | head -1 || echo installed)"
          echo "MOLTJOBS_SECRET_PATH=$KEY_FILE"
          echo "MOLTJOBS_WRAPPER=$WRAPPER"
          echo "MOLTJOBS_KEY_PRESENT=$([[ -s "$KEY_FILE" ]] && echo true || echo false)"
          REMOTE

          gcloud compute ssh "${VM_NAME}" \
            --project="${PROJECT_ID}" \
            --zone="${ZONE}" \
            --quiet \
            --command='sudo bash -s' < /tmp/bootstrap-moltjobs.sh
