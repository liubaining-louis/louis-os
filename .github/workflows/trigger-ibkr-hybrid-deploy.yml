name: Trigger IBKR Setup

on:
  push:
    paths:
      - '.github/workflows/trigger-ibkr-hybrid-deploy.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[workflow-policy-only]') }}
    concurrency:
      group: louis-os-single-execution
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch persistent IB Gateway setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run setup-ib-gateway-persistent.yml --repo "$GITHUB_REPOSITORY" --ref main

