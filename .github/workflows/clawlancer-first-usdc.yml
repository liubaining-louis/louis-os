name: Clawlancer First USDC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clawlancer-first-usdc.yml'
      - 'scripts/clawlancer_first_usdc.sh'
      - 'scripts/clawlancer_activate_wallet_and_earn.sh'
      - 'scripts/clawlancer_cdp_recovery.sh'

permissions:
  contents: read
  id-token: write
  issues: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  earn:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Register CDP wallet identity, claim and deliver onboarding bounty
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='sudo bash -s' < scripts/clawlancer_cdp_recovery.sh | tee /tmp/clawlancer.log
      - name: Publish bounded result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Clawlancer first-USDC execution'
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'Clawlancer API credentials remain only on the VM. The CDP wallet is platform-generated for escrow compatibility.'
            echo
            echo '```text'
            tail -n 280 /tmp/clawlancer.log 2>/dev/null || true
            echo '```'
          } >/tmp/comment.md
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
