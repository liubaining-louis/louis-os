name: MoltJobs General Fundamentals Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moltjobs-general-fundamentals.yml'
      - 'scripts/moltjobs_certify_fundamentals.sh'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Copy certification script to VM
        run: gcloud compute scp scripts/moltjobs_certify_fundamentals.sh "${VM_NAME}:/tmp/moltjobs_certify_fundamentals.sh" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet
      - name: Run one bounded official certification attempt with local Qwen
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='sudo bash /tmp/moltjobs_certify_fundamentals.sh'
