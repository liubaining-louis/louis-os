name: Autonomous tested submission

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "requests/autonomous-cycle.json"
      - "atlas/narrow_payable_scout.py"
      - "atlas/safe_convertible_bounty_scout.py"
      - "atlas/final_bounty_safety_gate.py"
      - "atlas/payable_source_adapters.py"
      - "atlas/patch_capabilities.py"
      - "atlas/capability_first_payable_scout.py"
      - "atlas/capability_patch_builder.py"
      - "atlas/repository_patch_builder.py"
      - "atlas/opportunity_authenticity.py"
      - "scripts/autonomous_narrow_payable_scout.py"
      - "scripts/autonomous_target_patch_builder.py"
      - "scripts/autonomous_submission_package_builder.py"
      - "scripts/autonomous_pull_request_submitter.py"
      - ".github/workflows/autonomous-tested-submission.yml"

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: monetization-ledger-writer
  cancel-in-progress: false

jobs:
  submit-and-maintain:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Louis OS
        run: python -m pip install .

      - name: Validate submission engine
        run: |
          python -m unittest tests.test_autonomous_submission -v
          python -m unittest tests.test_submission_monitor -v
          python -m unittest tests.test_repository_patch_builder -v
          python -m unittest tests.test_opportunity_authenticity -v
          python -m unittest tests.test_narrow_payable_scout -v
          python -m unittest tests.test_safe_convertible_bounty_scout -v
          python -m unittest tests.test_final_bounty_safety_gate -v
          python -m unittest tests.test_payable_source_adapters -v
          python -m unittest tests.test_patch_capabilities -v
          python -m unittest tests.test_capability_first_payable_scout -v
          python -m unittest tests.test_capability_patch_builder -v

      - name: Refresh capability-matched verified payable opportunities
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_EXTERNAL_GITHUB_TOKEN: ${{ secrets.ATLAS_EXTERNAL_GITHUB_TOKEN }}
        run: python scripts/autonomous_narrow_payable_scout.py

      - name: Build a syntax-aware tested capability patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_EXTERNAL_GITHUB_TOKEN: ${{ secrets.ATLAS_EXTERNAL_GITHUB_TOKEN }}
        run: python scripts/autonomous_target_patch_builder.py

      - name: Build or diagnose the submission package
        run: python scripts/autonomous_submission_package_builder.py

      - name: Submit a tested repository patch when ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_EXTERNAL_GITHUB_TOKEN: ${{ secrets.ATLAS_EXTERNAL_GITHUB_TOKEN }}
        run: python scripts/autonomous_pull_request_submitter.py

      - name: Monitor current pull request and derive next action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_EXTERNAL_GITHUB_TOKEN: ${{ secrets.ATLAS_EXTERNAL_GITHUB_TOKEN }}
        run: python scripts/autonomous_submission_monitor.py

      - name: Persist submission evidence
        run: |
          if [ -z "$(git status --porcelain -- results/)" ]; then
            echo "No submission state changes"
            exit 0
          fi
          git config user.name "louis-os[bot]"
          git config user.email "louis-os[bot]@users.noreply.github.com"
          for path in \
            results/monetization.json \
            results/monetization_candidates.json \
            results/narrow_payable_scout.json \
            results/target_preflight.json \
            results/target_repository_workspaces \
            results/submission_package.json \
            results/submission_receipts.json \
            results/submission_diagnosis.json \
            results/submission_monitor.json; do
            if [ -e "$path" ]; then
              git add -f "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No staged submission changes"
            exit 0
          fi
          git commit -m "Record autonomous capability-first payable cycle"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
