name: Inspect AI Option Trader Model

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: test-bot-499814
      ZONE: europe-central2-a
      VM_NAME: gemini12345
      STATUS_ISSUE: '440'
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect latest PPO and port owner
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/inspect.sh <<'REMOTE'
          set -euo pipefail
          APP=/home/liubaining/AI-Option-Trader
          echo '=== MODEL STAT / SPACE ==='
          sudo stat -c 'model=%n size=%s owner=%U:%G modified=%y' "$APP/models/ppo_option_model.zip"
          sudo -u liubaining -H "$APP/venv/bin/python" - <<'PY'
          from stable_baselines3 import PPO
          import numpy as np
          p='/home/liubaining/AI-Option-Trader/models/ppo_option_model.zip'
          m=PPO.load(p, device='cpu')
          print('observation_space=', m.observation_space)
          print('obs_shape=', m.observation_space.shape)
          print('obs_low=', np.asarray(m.observation_space.low).tolist())
          print('obs_high=', np.asarray(m.observation_space.high).tolist())
          print('action_space=', m.action_space)
          print('action_n=', getattr(m.action_space, 'n', None))
          print('policy=', type(m.policy).__name__)
          PY
          echo
          echo '=== OPTION_GYM.PY ==='
          sudo sed -n '1,360p' "$APP/envs/option_gym.py"
          echo
          echo '=== TRAIN_PPO.PY ==='
          sudo sed -n '1,360p' "$APP/train_ppo.py"
          echo
          echo '=== PRE-DEPLOY MAIN_API BACKUP ==='
          sudo sed -n '1,420p' "$APP/main_api.py.pre_3d_deploy.bak" 2>/dev/null || true
          echo
          echo '=== CURRENT MAIN_API ==='
          sudo sed -n '1,360p' "$APP/main_api.py" 2>/dev/null || true
          echo
          echo '=== PORT 8000 OWNER ==='
          sudo ss -ltnp '( sport = :8000 )' 2>/dev/null || true
          sudo lsof -nP -iTCP:8000 -sTCP:LISTEN 2>/dev/null || true
          echo
          echo '=== RELATED PROCESSES ==='
          ps -ef | grep -E 'uvicorn|main_api|AI-Option-Trader' | grep -v grep || true
          echo
          echo '=== SERVICES ==='
          sudo systemctl is-active ai-option-trader-api.service 2>/dev/null || true
          sudo systemctl is-active ai-option-trader-tunnel.service 2>/dev/null || true
          sudo journalctl -u ai-option-trader-api.service -n 80 --no-pager 2>/dev/null || true
          echo
          echo '=== LOCAL ROOT/HEALTH/OPENAPI ==='
          curl -sS -i http://127.0.0.1:8000/ 2>/dev/null | head -n 30 || true
          curl -sS -i http://127.0.0.1:8000/health 2>/dev/null | head -n 40 || true
          curl -sS http://127.0.0.1:8000/openapi.json 2>/dev/null | head -c 6000 || true
          echo
          REMOTE
          gcloud compute ssh "$VM_NAME" --project="$PROJECT_ID" --zone="$ZONE" --quiet --command='bash -s' < /tmp/inspect.sh | tee /tmp/inspect.log
      - name: Publish inspection
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Correct-VM PPO inspection v2'
            echo
            echo '```text'
            tail -n 2200 /tmp/inspect.log 2>/dev/null || echo 'No inspection output'
            echo '```'
          } >/tmp/report.md
          gh issue comment "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
