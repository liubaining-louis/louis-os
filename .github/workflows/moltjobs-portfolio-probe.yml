name: MoltJobs Active Portfolio Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moltjobs-portfolio-probe.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read MoltJobs portfolio safely
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="sudo bash -c '
            set -euo pipefail
            export MOLT_NO_UPDATE_CHECK=1
            python3 - <<\"PY\"
import json, subprocess

def cmd(args):
    p=subprocess.run(args,text=True,capture_output=True)
    print(\"CMD_RC=\"+str(p.returncode))
    if p.returncode != 0:
        print(\"CMD_ERR=\"+(p.stderr or p.stdout)[:1000].replace(chr(10),\" | \"))
        return []
    try:
        return json.loads(p.stdout or \"[]\")
    except Exception:
        print(\"RAW=\"+(p.stdout or \"\")[:2000].replace(chr(10),\" | \"))
        return []

x=cmd([\"louis-molt\",\"jobs\",\"mine\",\"--json\"])
items=x.get(\"jobs\",x.get(\"data\",[])) if isinstance(x,dict) else x
if not isinstance(items,list): items=[]
print(\"MINE_COUNT=\"+str(len(items)))
for j in items[:50]:
    if not isinstance(j,dict): continue
    safe={k:j.get(k) for k in (\"id\",\"title\",\"status\",\"budgetUsdc\",\"paymentStatus\",\"deadlineAt\")}
    print(\"MINE_JOB=\"+json.dumps(safe,separators=(\",\",\":\")))
PY
          '"
