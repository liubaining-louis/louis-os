name: Provision Louis OS VM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-louis-os-vm.yml"
      - "atlas/vm_command_bus.py"
      - "atlas/autonomy_kernel.py"
      - "atlas/*source*.py"
      - "atlas/universal_market.py"
      - "atlas/software_micro_missions.py"
      - "atlas/automation_compatibility.py"
      - "atlas/capability_market.py"
      - "atlas/cash_first_market.py"
      - "atlas/superteam_crypto_cycle.py"
      - "atlas/crypto_identity.py"
      - "atlas/evm_identity.py"
      - "atlas/crypto_revenue.py"
      - "scripts/bootstrap_crypto_identity.py"
      - "scripts/superteam_crypto_cycle.py"
      - "scripts/crypto_revenue_cycle.py"
      - "scripts/vm_monetization_worker.py"
      - "scripts/autonomy_cycle.py"
      - "scripts/universal_market_cycle.py"
      - "scripts/refresh_small_bounty_sources.py"
      - "scripts/verify_small_bounty_issue_state.py"
      - "scripts/refresh_simple_mission_sources.py"
      - "scripts/software_micro_mission_cycle.py"
      - "scripts/classify_software_micro_missions.py"
      - "scripts/enforce_delivery_compatibility.py"
      - "scripts/capability_market_cycle.py"
      - "scripts/prepare_simple_mission_dossiers.py"
      - "scripts/cash_first_market_postprocess.py"
      - "scripts/sync_cash_first_ledger.py"
      - "scripts/cash_first_recovery_cycle.py"
      - "scripts/sync_operational_state_to_firestore.py"
      - "Dockerfile"
      - "pyproject.toml"

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: louis-os-vm-production
  cancel-in-progress: false

env:
  PROJECT_ID: test-bot-499814
  REGION: europe-west1
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01
  MACHINE_TYPE: e2-medium

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Check required APIs
        shell: bash
        run: |
          set -euo pipefail
          for service in compute.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com firestore.googleapis.com; do
            state="$(gcloud services list --enabled --project="${PROJECT_ID}" --filter="config.name=${service}" --format='value(config.name)')"
            if [[ "${state}" != "${service}" ]]; then
              echo "Required API is not enabled: ${service}"
              exit 1
            fi
          done

      - name: Build immutable worker image without log streaming
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="gcr.io/${PROJECT_ID}/louis-os-worker:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          BUILD_ID="$(gcloud builds submit --project="${PROJECT_ID}" --tag="${IMAGE}" --async --format='value(id)' .)"
          test -n "${BUILD_ID}"
          echo "Cloud Build ID: ${BUILD_ID}"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "Build status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            if [[ "${attempt}" -eq 90 ]]; then exit 1; fi
            sleep 10
          done

      - name: Write VM startup script
        shell: bash
        run: |
          cat > /tmp/louis-os-startup.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec > >(tee -a /var/log/louis-os-startup.log) 2>&1
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io curl python3
          systemctl enable --now docker

          TOKEN="$(curl -fsS -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          echo "${TOKEN}" | docker login -u oauth2accesstoken --password-stdin https://gcr.io
          IMAGE="$(curl -fsS -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/attributes/louis-os-image')"

          mkdir -p /var/lib/louis-os/results /var/lib/louis-os/secrets
          chmod 700 /var/lib/louis-os/secrets
          SUPERTEAM_ENV=/var/lib/louis-os/secrets/superteam.env
          SUPERTEAM_CLAIM=/var/lib/louis-os/secrets/superteam-claim-code

          if [[ ! -s "${SUPERTEAM_ENV}" ]]; then
            umask 077
            RESPONSE_FILE="$(mktemp /var/lib/louis-os/secrets/superteam-register.XXXXXX)"
            chmod 600 "${RESPONSE_FILE}"
            curl -fsS -X POST https://superteam.fun/api/agents \
              -H 'Content-Type: application/json' \
              -d '{"name":"louis-os-agent"}' > "${RESPONSE_FILE}"
            API_KEY="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("apiKey", ""))' "${RESPONSE_FILE}")"
            CLAIM_CODE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("claimCode", ""))' "${RESPONSE_FILE}")"
            test -n "${API_KEY}"
            test -n "${CLAIM_CODE}"
            printf 'SUPERTEAM_API_KEY=%s\n' "${API_KEY}" > "${SUPERTEAM_ENV}"
            printf '%s' "${CLAIM_CODE}" > "${SUPERTEAM_CLAIM}"
            chmod 600 "${SUPERTEAM_ENV}" "${SUPERTEAM_CLAIM}"
            rm -f "${RESPONSE_FILE}"
            unset API_KEY CLAIM_CODE
            echo "Superteam agent credential bootstrapped to VM-local persistent storage."
          else
            echo "Superteam VM-local credential already present."
          fi

          docker pull "${IMAGE}"

          # One-shot identity bootstrap. The private Solana key exists only in the VM-local
          # secret volume; only the public address and non-secret account registry are written
          # to results. The long-running worker never receives the wallet private key.
          docker run --rm \
            --env-file "${SUPERTEAM_ENV}" \
            -e LOUIS_ACCOUNT_EMAIL=optimumanufacturing@gmail.com \
            -e SUPERTEAM_AGENT_NAME=louis-os-agent \
            -e AGENTPACT_AGENT_ID=e94bfedc-d1e7-4814-a157-ea8f750a4acc \
            -v /var/lib/louis-os/secrets:/app/runtime-secrets \
            -v /var/lib/louis-os/results:/app/results \
            "${IMAGE}" \
            python scripts/bootstrap_crypto_identity.py --secret-dir /app/runtime-secrets --results-dir /app/results

          docker rm -f louis-os-worker 2>/dev/null || true
          docker run -d \
            --name louis-os-worker \
            --restart unless-stopped \
            --env-file "${SUPERTEAM_ENV}" \
            -e GOOGLE_CLOUD_PROJECT=test-bot-499814 \
            -e LOUIS_VM_INTERVAL_SECONDS=300 \
            -e LOUIS_VM_HEARTBEAT_SECONDS=10 \
            -e LOUIS_LIVE_STATE_FIRESTORE=1 \
            -v /var/lib/louis-os/results:/app/results \
            "${IMAGE}" \
            python scripts/vm_monetization_worker.py

          # Receive-only crypto monitor: public wallet data only, no private key mount.
          docker rm -f louis-os-crypto-monitor 2>/dev/null || true
          docker run -d \
            --name louis-os-crypto-monitor \
            --restart unless-stopped \
            -e SOLANA_RPC_URL=https://api.mainnet-beta.solana.com \
            -v /var/lib/louis-os/results:/app/results \
            "${IMAGE}" \
            sh -c 'while true; do python scripts/crypto_revenue_cycle.py || true; sleep 60; done'

          test -s /var/lib/louis-os/results/crypto_wallet_public.json
          test -s /var/lib/louis-os/results/base_wallet_public.json
          test -s /var/lib/louis-os/results/platform_accounts.json
          test -s /var/lib/louis-os/results/agent_market_bootstrap.json

          for attempt in $(seq 1 30); do
            if [[ -s /var/lib/louis-os/results/vm_worker_heartbeat.json ]]; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/var/lib/louis-os/results/vm_worker_heartbeat.json')
          data = json.loads(path.read_text())
          wallet = json.loads(Path('/var/lib/louis-os/results/crypto_wallet_public.json').read_text())
          base_wallet = json.loads(Path('/var/lib/louis-os/results/base_wallet_public.json').read_text())
          bootstrap = json.loads(Path('/var/lib/louis-os/results/agent_market_bootstrap.json').read_text())
          crypto = Path('/var/lib/louis-os/results/crypto_realization.json')
          print('LOUIS_VM_HEARTBEAT=' + json.dumps({
              'schema_version': data.get('schema_version'),
              'worker': data.get('worker'),
              'status': data.get('status'),
              'phase': data.get('phase'),
              'cycle': data.get('cycle'),
              'updated_at': data.get('updated_at'),
              'heartbeat_interval_seconds': data.get('heartbeat_interval_seconds'),
              'firestore_publish_status': data.get('firestore_publish_status'),
              'crypto_wallet_chain': wallet.get('chain'),
              'crypto_wallet_receive_enabled': wallet.get('receive_enabled'),
              'base_wallet_chain': base_wallet.get('chain'),
              'base_wallet_receive_enabled': base_wallet.get('receive_enabled'),
              'agentpact_status': ((bootstrap.get('platform_accounts') or {}).get('agentpact') or {}).get('status'),
              'agentpact_offer_status': (bootstrap.get('agentpact_offer') or {}).get('status'),
              'crypto_monitor_started': crypto.exists(),
          }))
          PY
              break
            fi
            sleep 5
          done
          SCRIPT

      - name: Create or update always-on VM
        shell: bash
        run: |
          set -euo pipefail
          if gcloud compute instances describe "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud compute instances add-metadata "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}" --metadata-from-file startup-script=/tmp/louis-os-startup.sh --metadata "louis-os-image=${IMAGE}"
            gcloud compute instances reset "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}"
          else
            gcloud compute instances create "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --machine-type="${MACHINE_TYPE}" --image-family=debian-12 --image-project=debian-cloud --boot-disk-size=30GB --boot-disk-type=pd-balanced --maintenance-policy=MIGRATE --restart-on-failure --scopes=https://www.googleapis.com/auth/cloud-platform --metadata-from-file startup-script=/tmp/louis-os-startup.sh --metadata "louis-os-image=${IMAGE}" --labels=app=louis-os,role=autonomous-worker,environment=production
          fi

      - name: Verify VM and live state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            STATUS="$(gcloud compute instances describe "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --format='value(status)')"
            echo "VM status: ${STATUS}"
            [[ "${STATUS}" == "RUNNING" ]] && break
            sleep 10
          done
          [[ "${STATUS}" == "RUNNING" ]]
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          LIVE_URL="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/louis_live/current"
          for attempt in $(seq 1 36); do
            if BODY="$(curl -fsS -H "Authorization: Bearer ${ACCESS_TOKEN}" "${LIVE_URL}" 2>/dev/null)"; then
              if echo "${BODY}" | grep -q 'gcp_vm_monetization_worker'; then
                echo "${BODY}" > /tmp/louis-live.json
                break
              fi
            fi
            if [[ "${attempt}" -eq 36 ]]; then exit 1; fi
            sleep 5
          done
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/louis-live.json'))
          fields = data.get('fields', {})
          def value(name):
              item = fields.get(name, {})
              for key in ('stringValue','integerValue','doubleValue','booleanValue','timestampValue'):
                  if key in item: return item[key]
              return None
          summary = {'worker': value('worker'), 'status': value('status'), 'heartbeat_interval_seconds': value('heartbeat_interval_seconds')}
          print(json.dumps(summary, indent=2))
          assert summary['worker'] == 'gcp_vm_monetization_worker', summary
          assert summary['status'] in {'running','healthy'}, summary
          assert str(summary['heartbeat_interval_seconds']) == '10', summary
          PY

      - name: Publish deployment result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh issue comment 257 --repo "$GITHUB_REPOSITORY" --body "GCP VM Docker deployment completed with status: **${JOB_STATUS}**. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 264 --repo "$GITHUB_REPOSITORY" --body "Superteam VM-local bootstrap + rollout status: **${JOB_STATUS}**. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body "Three-channel Louis rollout (Superteam + BountyBook + AgentPact): **${JOB_STATUS}**. No spend, stake, KYC or financial signing enabled. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
