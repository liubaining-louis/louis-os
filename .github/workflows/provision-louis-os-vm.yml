name: Bootstrap Louis OS VM (VM-first)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: louis-os-vm-bootstrap
  cancel-in-progress: false

env:
  PROJECT_ID: test-bot-499814
  REGION: europe-west1
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01
  MACHINE_TYPE: e2-medium

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build VM-first image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="gcr.io/${PROJECT_ID}/louis-os-worker:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          BUILD_ID="$(gcloud builds submit --project="${PROJECT_ID}" --tag="${IMAGE}" --async --format='value(id)' .)"
          test -n "${BUILD_ID}"
          for attempt in $(seq 1 90); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project="${PROJECT_ID}" --format='value(status)')"
            echo "Cloud Build: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) exit 1 ;;
            esac
            [[ "${attempt}" -lt 90 ]] || exit 1
            sleep 10
          done

      - name: Prepare VM-first startup script
        shell: bash
        run: |
          cat >/tmp/louis-os-vm-first-startup.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec > >(tee -a /var/log/louis-os-vm-first-bootstrap.log) 2>&1

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io curl python3
          systemctl enable --now docker

          TOKEN="$(curl -fsS -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          echo "${TOKEN}" | docker login -u oauth2accesstoken --password-stdin https://gcr.io
          unset TOKEN

          IMAGE="$(curl -fsS -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/attributes/louis-os-image')"
          test -n "${IMAGE}"
          mkdir -p /var/lib/louis-os/results /var/lib/louis-os/secrets
          chmod 700 /var/lib/louis-os/secrets

          SUPERTEAM_ENV=/var/lib/louis-os/secrets/superteam.env
          SUPERTEAM_CLAIM=/var/lib/louis-os/secrets/superteam-claim-code
          if [[ ! -s "${SUPERTEAM_ENV}" ]]; then
            umask 077
            RESPONSE_FILE="$(mktemp /var/lib/louis-os/secrets/superteam-register.XXXXXX)"
            curl -fsS -X POST https://superteam.fun/api/agents \
              -H 'Content-Type: application/json' \
              -d '{"name":"louis-os-agent"}' >"${RESPONSE_FILE}"
            API_KEY="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("apiKey", ""))' "${RESPONSE_FILE}")"
            CLAIM_CODE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("claimCode", ""))' "${RESPONSE_FILE}")"
            test -n "${API_KEY}" && test -n "${CLAIM_CODE}"
            printf 'SUPERTEAM_API_KEY=%s\n' "${API_KEY}" >"${SUPERTEAM_ENV}"
            printf '%s' "${CLAIM_CODE}" >"${SUPERTEAM_CLAIM}"
            chmod 600 "${SUPERTEAM_ENV}" "${SUPERTEAM_CLAIM}"
            rm -f "${RESPONSE_FILE}"
            unset API_KEY CLAIM_CODE
          fi

          docker pull "${IMAGE}"

          docker run --rm \
            --env-file "${SUPERTEAM_ENV}" \
            -e LOUIS_ACCOUNT_EMAIL=optimumanufacturing@gmail.com \
            -e SUPERTEAM_AGENT_NAME=louis-os-agent \
            -e AGENTPACT_AGENT_ID=e94bfedc-d1e7-4814-a157-ea8f750a4acc \
            -v /var/lib/louis-os/secrets:/app/runtime-secrets \
            -v /var/lib/louis-os/results:/app/results \
            "${IMAGE}" \
            python scripts/bootstrap_crypto_identity.py --secret-dir /app/runtime-secrets --results-dir /app/results

          docker run --rm "${IMAGE}" cat /app/scripts/vm_first_supervisor.sh >/usr/local/bin/louis-os-vm-first-supervisor
          chmod 755 /usr/local/bin/louis-os-vm-first-supervisor

          cat >/etc/systemd/system/louis-os-vm-first.service <<EOF
          [Unit]
          Description=Louis OS VM-first autonomous runtime
          After=docker.service network-online.target
          Wants=network-online.target
          Requires=docker.service

          [Service]
          Type=simple
          Environment=LOUIS_IMAGE=${IMAGE}
          Environment=GOOGLE_CLOUD_PROJECT=test-bot-499814
          Environment=LOUIS_RESULTS_DIR=/var/lib/louis-os/results
          Environment=LOUIS_SECRETS_DIR=/var/lib/louis-os/secrets
          ExecStart=/usr/local/bin/louis-os-vm-first-supervisor
          Restart=always
          RestartSec=5
          StartLimitIntervalSec=0

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now louis-os-vm-first.service
          echo "VM-first runtime installed for ${IMAGE}"
          SCRIPT

      - name: Install or update VM-first runtime
        shell: bash
        run: |
          set -euo pipefail
          if gcloud compute instances describe "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud compute instances add-metadata "${VM_NAME}" \
              --zone="${ZONE}" --project="${PROJECT_ID}" \
              --metadata-from-file startup-script=/tmp/louis-os-vm-first-startup.sh \
              --metadata "louis-os-image=${IMAGE}"
            gcloud compute instances reset "${VM_NAME}" --zone="${ZONE}" --project="${PROJECT_ID}"
          else
            gcloud compute instances create "${VM_NAME}" \
              --project="${PROJECT_ID}" --zone="${ZONE}" \
              --machine-type="${MACHINE_TYPE}" \
              --image-family=debian-12 --image-project=debian-cloud \
              --boot-disk-size=30GB --boot-disk-type=pd-balanced \
              --maintenance-policy=MIGRATE --restart-on-failure \
              --scopes=https://www.googleapis.com/auth/cloud-platform \
              --metadata-from-file startup-script=/tmp/louis-os-vm-first-startup.sh \
              --metadata "louis-os-image=${IMAGE}" \
              --labels=app=louis-os,role=autonomous-worker,environment=production
          fi

      - name: Verify VM-first heartbeat
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            STATUS="$(gcloud compute instances describe "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --format='value(status)' 2>/dev/null || true)"
            echo "VM status: ${STATUS}"
            if [[ "${STATUS}" == "RUNNING" ]]; then
              ACCESS_TOKEN="$(gcloud auth print-access-token)"
              LIVE_URL="https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/louis_live/current"
              BODY="$(curl -fsS -H "Authorization: Bearer ${ACCESS_TOKEN}" "${LIVE_URL}" 2>/dev/null || true)"
              if echo "${BODY}" | grep -q 'gcp_vm_monetization_worker'; then
                echo "Louis worker heartbeat found. Runtime is VM-first."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "VM-first heartbeat was not observed in time" >&2
          exit 1

      - name: Publish bootstrap result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh issue comment 257 --repo "$GITHUB_REPOSITORY" --body "VM-first bootstrap status: **${JOB_STATUS}**. After a successful bootstrap, runtime supervision, browser health, autonomy and crypto monitoring execute on the GCP VM rather than GitHub Actions. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 322 --repo "$GITHUB_REPOSITORY" --body "VM-first browser cutover bootstrap: **${JOB_STATUS}**. Browser health is now handled by the VM-local browser monitor after successful installation. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
