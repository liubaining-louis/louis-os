name: Universal market monetization

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "requests/universal-market-cycle.json"
      - "atlas/universal_market.py"
      - "atlas/usagov_challenge_source.py"
      - "atlas/small_bounty_sources.py"
      - "atlas/simple_mission_sources.py"
      - "atlas/cash_first_market.py"
      - "config/universal_market_sources.json"
      - "config/universal_capabilities.json"
      - "docs/prompts/UNIVERSAL_MARKET_MONETIZATION.md"
      - "scripts/universal_market_cycle.py"
      - "scripts/refresh_small_bounty_sources.py"
      - "scripts/refresh_simple_mission_sources.py"
      - "scripts/prepare_simple_mission_dossiers.py"
      - "scripts/cash_first_market_postprocess.py"
      - "scripts/create_capability_gap_issues.py"
      - ".github/workflows/universal-market-monetization.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: universal-market-monetization
  cancel-in-progress: false

jobs:
  discover-build-and-route:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Louis OS
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Validate universal market engine
        run: |
          python -m unittest tests.test_universal_market -v
          python -m unittest tests.test_usagov_challenge_source -v
          python -m unittest tests.test_small_bounty_sources -v
          python -m unittest tests.test_simple_mission_sources -v
          python -m unittest tests.test_cash_first_market -v
          python -m unittest tests.test_universal_market_workflow -v

      - name: Scan the universal internet market
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPWORK_ACCESS_TOKEN: ${{ secrets.UPWORK_ACCESS_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          HACKERONE_API_TOKEN: ${{ secrets.HACKERONE_API_TOKEN }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: python scripts/universal_market_cycle.py

      - name: Refresh official small-bounty sources
        run: python scripts/refresh_small_bounty_sources.py

      - name: Refresh official simple freelance missions
        run: python scripts/refresh_simple_mission_sources.py

      - name: Prepare complete simple-mission proposal dossiers
        run: python scripts/prepare_simple_mission_dossiers.py

      - name: Prioritize small missions and exact human gates
        run: python scripts/cash_first_market_postprocess.py

      - name: Create bounded cash-first capability tasks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/create_capability_gap_issues.py

      - name: Persist universal market evidence without shared-ledger races
        run: |
          git config user.name "louis-os[bot]"
          git config user.email "louis-os[bot]@users.noreply.github.com"

          # results/monetization.json is owned by the autonomous submission workflow.
          # That workflow synchronizes these dedicated cash-first artifacts into it.
          git restore --worktree --staged results/monetization.json || true

          for path in \
            results/universal_market_opportunities.json \
            results/universal_market_cycle.json \
            results/small_bounty_source_refresh.json \
            results/simple_mission_source_refresh.json \
            results/simple_mission_dossier_receipts.json \
            results/simple_mission_dossiers \
            results/cash_first_market.json \
            results/human_action_required.json \
            results/capability_backlog.json \
            results/capability_issue_receipts.json; do
            if [ -e "$path" ]; then
              git add -f "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No universal market state changes"
            exit 0
          fi
          git commit -m "Record cash-first universal market cycle"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Publish truthful simple-mission market status
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY' > /tmp/universal-market-report.md
          import json
          from pathlib import Path

          cycle = json.loads(Path("results/universal_market_cycle.json").read_text())
          market = json.loads(Path("results/universal_market_opportunities.json").read_text())
          cash = json.loads(Path("results/cash_first_market.json").read_text())
          bounty = json.loads(Path("results/small_bounty_source_refresh.json").read_text())
          simple = json.loads(Path("results/simple_mission_source_refresh.json").read_text())
          dossiers = json.loads(Path("results/simple_mission_dossier_receipts.json").read_text())

          print("Maintenant Louis OS cherche en priorité des missions numériques simples et rapides, vérifie le budget public et prépare le dossier avant de demander le dernier gate humain.")
          print()
          print(f"- Sources suivies : {cycle['sources_total']}")
          print(f"- Sources actives ou partielles : {cycle['sources_ok_or_partial']}")
          print(f"- Petites bounties observées : {bounty.get('opportunities_observed', 0)}")
          print(f"- Missions freelance simples observées : {simple.get('opportunities_observed', 0)}")
          print(f"- Opportunités observées au total : {cycle['opportunities_observed']}")
          print(f"- Petites missions cash-first : {cycle.get('cash_first_candidates', 0)}")
          print(f"- Dossiers de proposition préparés : {dossiers.get('prepared_count', 0)}")
          print(f"- Opportunités stratégiques : {cycle.get('strategic_candidates', 0)}")
          print(f"- Exécutables immédiatement : {cycle['opportunities_executable_now']}")
          print(f"- Validations humaines prêtes : {cycle.get('human_action_ready', 0)}")
          print(f"- Nouvelles alertes humaines : {cycle.get('new_human_actions', 0)}")
          print(f"- Soumissions externes vérifiées : {cycle['external_submissions_verified']}")
          print(f"- Revenu vérifié : {cycle['revenue_verified_eur']} €")
          print(f"- Prochaine action : `{cycle['next_action']}`")
          top = cash.get('top_cash_first')
          if top:
              print(f"- Meilleure mission : [{top['title']}]({top['source_url']}) — {top['reward_amount']} {top['currency']}, {top['estimated_effort_hours']} h estimées, score cash {top['cash_priority_score']}/100")
          print(f"- Prompt audité : `{market['mission_prompt_sha256']}`")
          PY
          gh issue comment 77 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/universal-market-report.md
          gh issue comment 141 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/universal-market-report.md
          gh issue comment 178 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/universal-market-report.md

      - name: Alert owner only for a new exact human action
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          NEW_COUNT="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('results/human_action_required.json').read_text())
          print(data.get('new_count', 0))
          PY
          )"
          if [ "$NEW_COUNT" = "0" ]; then
            echo "No new human action; no alert published."
            exit 0
          fi
          python - <<'PY' > /tmp/human-action-alert.md
          import json
          from pathlib import Path
          data = json.loads(Path('results/human_action_required.json').read_text())
          print("## Action humaine minimale requise — mission payable préparée")
          print()
          for item in data.get('new_items', []):
              print(f"### [{item['title']}]({item['source_url']})")
              print(f"- Rémunération conservatrice : {item['reward_amount']} {item['currency']}")
              print(f"- Échéance : {item.get('deadline') or 'non précisée'}")
              print(f"- Effort estimé : {item['estimated_effort_hours']} h")
              print(f"- Délai de paiement estimé : {item['time_to_cash_days']} jours")
              print(f"- Moyen(x) de paiement prévu(s) : {', '.join(item.get('payment_methods') or [])}")
              print(f"- Risque : {item.get('risk_summary') or 'non précisé'}")
              print(f"- Urgence : {item['urgency']}")
              print("- Action exacte :")
              for action in item.get('human_actions', []):
                  print(f"  - {action}")
              print("- Dossier déjà préparé :")
              for artifact in item.get('prepared_artifacts', []):
                  print(f"  - `{artifact}`")
              print(f"- Preuves : {', '.join(item.get('evidence') or [])}")
              print("- Louis OS continue toutes les recherches et actions réversibles pendant l’attente.")
              print()
          PY
          gh issue comment 77 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/human-action-alert.md
          gh issue comment 141 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/human-action-alert.md
