name: Probe VM local LLM capacity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-vm-local-llm-capacity.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect compute capacity only
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/probe-capacity.sh <<'REMOTE'
          set -euo pipefail
          echo '===CPU==='
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          echo '===RAM==='
          free -h
          echo '===DISK==='
          df -h / /var/lib/louis-os 2>/dev/null || df -h /
          echo '===GPU==='
          command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || echo none
          echo '===OLLAMA==='
          command -v ollama >/dev/null 2>&1 && ollama --version || echo not_installed
          REMOTE
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='bash -s' < /tmp/probe-capacity.sh
