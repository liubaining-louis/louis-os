name: Verify MoltJobs API access on Louis VM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moltjobs-live-probe.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify API identity, bid allowance, wallet, and live jobs
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command="sudo bash -c '
            set -euo pipefail
            export MOLT_NO_UPDATE_CHECK=1
            echo ===AGENT===
            louis-molt agent me --json
            echo ===BIDS===
            louis-molt bids allowance --json
            echo ===WALLET===
            louis-molt wallet balance --json
            echo ===JOBS===
            louis-molt jobs list --limit 10 --json
          '"
