name: Bootstrap local eval model on Louis VM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-local-eval-model.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Install Ollama and pull bounded local model
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/bootstrap-local-model.sh <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh >/tmp/ollama-install.log 2>&1
          fi
          systemctl enable --now ollama >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen2.5:3b
          echo '===LOCAL_MODEL_TEST==='
          RESPONSE="$(ollama run qwen2.5:3b 'Answer with only the number: what is 7 multiplied by 8?')"
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | grep -Eq '(^|[^0-9])56([^0-9]|$)'
          echo 'LOCAL_MODEL_READY=true'
          ollama list
          REMOTE
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet --command='sudo bash -s' < /tmp/bootstrap-local-model.sh
