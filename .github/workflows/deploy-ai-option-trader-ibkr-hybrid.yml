name: Deploy AI Option Trader IBKR Hybrid

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-ai-option-trader-ibkr-hybrid.yml'

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: test-bot-499814
      ZONE: europe-central2-a
      VM_NAME: gemini12345
      STATUS_ISSUE: '437'
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy IBKR-first market adapter
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/deploy-ibkr.sh <<'REMOTE'
          set -euo pipefail
          APP=/home/liubaining/AI-Option-Trader
          USER=liubaining
          PY="$APP/venv/bin/python"
          test -x "$PY" || { echo 'Missing Python venv' >&2; exit 20; }
          test -f "$APP/models/ppo_option_model.zip" || { echo 'Missing PPO model' >&2; exit 21; }

          "$PY" - <<'PY'
          from stable_baselines3 import PPO
          m=PPO.load('/home/liubaining/AI-Option-Trader/models/ppo_option_model.zip', device='cpu')
          assert m.observation_space.shape == (7,), m.observation_space
          assert getattr(m.action_space, 'n', None) == 3, m.action_space
          print('MODEL_7D_OK')
          PY

          "$PY" -c 'import fastapi, uvicorn, yfinance, pandas, pandas_ta, scipy, stable_baselines3, ib_insync' || \
            "$PY" -m pip install --quiet --disable-pip-version-check fastapi 'uvicorn[standard]' yfinance pandas scipy pandas-ta ib_insync

          cp "$APP/main_api.py" "$APP/main_api.py.pre_ibkr_hybrid.bak" 2>/dev/null || true
          chown "$USER:$USER" "$APP/main_api.py.pre_ibkr_hybrid.bak" 2>/dev/null || true

          cat > "$APP/main_api.py" <<'PY'
          import asyncio
          import logging
          import os
          import socket
          import threading
          from contextlib import asynccontextmanager
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Optional

          import numpy as np
          import pandas_ta as ta  # noqa: F401
          import yfinance as yf
          from fastapi import FastAPI, HTTPException
          from pydantic import BaseModel, Field, model_validator
          from scipy.stats import norm
          from stable_baselines3 import PPO
          from ib_insync import IB, Stock

          logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(name)s: %(message)s')
          logger = logging.getLogger('ppo-options-ibkr-api')

          BASE_DIR = Path(__file__).resolve().parent
          MODEL_PATH = BASE_DIR / 'models' / 'ppo_option_model.zip'
          RISK_FREE_RATE = 0.04
          IBKR_HOST = os.getenv('IBKR_HOST', '127.0.0.1')
          IBKR_CLIENT_ID = int(os.getenv('IBKR_CLIENT_ID', '71'))
          IBKR_EXPLICIT_PORT = os.getenv('IBKR_PORT', '').strip()
          IBKR_PORTS = [int(IBKR_EXPLICIT_PORT)] if IBKR_EXPLICIT_PORT else [7497, 4002, 7496, 4001]

          model: Optional[PPO] = None
          model_load_error: Optional[str] = None

          ACTIONS = {
              0: ('HOLD', '观望', '当前 7D PPO 策略建议观望。'),
              1: ('BUY_CALL', '买入平值 Call', '当前 7D PPO 策略给出买入 Call 动作。'),
              2: ('CLOSE', '卖出平仓', '当前 7D PPO 策略给出平仓动作。'),
          }


          class RealMarketRequest(BaseModel):
              ticker: str = Field(..., min_length=1, max_length=12)
              dte: int = Field(..., ge=0, le=365)
              position: int = Field(..., ge=0, le=1)
              strike_price: Optional[float] = Field(None, gt=0)
              entry_price: Optional[float] = Field(None, ge=0)

              @model_validator(mode='after')
              def validate_position(self):
                  if self.position == 1 and (self.strike_price is None or self.entry_price is None):
                      raise ValueError('position=1 requires strike_price and entry_price')
                  return self


          class Predict7DRequest(BaseModel):
              stock_price: float = Field(..., gt=0)
              dte: int = Field(..., ge=0, le=365)
              position: int = Field(..., ge=0, le=1)
              rsi: float
              macd: float
              volatility: float = Field(..., ge=0)
              unrealized_pnl: float


          def normalize_ticker(value: str) -> str:
              ticker = value.strip().upper()
              allowed = set('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-^')
              if not ticker or any(ch not in allowed for ch in ticker):
                  raise ValueError('Invalid ticker format')
              return ticker


          def black_scholes_call(S: float, K: float, T: float, r: float, sigma: float) -> float:
              if T <= 0 or sigma <= 0:
                  return max(0.0, S - K)
              d1 = (np.log(S / K) + (r + 0.5 * sigma ** 2) * T) / (sigma * np.sqrt(T))
              d2 = d1 - sigma * np.sqrt(T)
              return float(S * norm.cdf(d1) - K * np.exp(-r * T) * norm.cdf(d2))


          def positive_price(*values):
              for value in values:
                  try:
                      v = float(value)
                      if np.isfinite(v) and v > 0:
                          return v
                  except Exception:
                      pass
              return None


          class IBKRPriceProvider:
              def __init__(self):
                  self.loop = asyncio.new_event_loop()
                  self.thread = threading.Thread(target=self._run_loop, name='ibkr-market-loop', daemon=True)
                  self.lock = threading.Lock()
                  self.last_error = None
                  self.thread.start()

              def _run_loop(self):
                  asyncio.set_event_loop(self.loop)
                  self.loop.run_forever()

              def reachable_ports(self):
                  result = []
                  for port in IBKR_PORTS:
                      s = socket.socket()
                      s.settimeout(0.25)
                      try:
                          s.connect((IBKR_HOST, port))
                          result.append(port)
                      except Exception:
                          pass
                      finally:
                          s.close()
                  return result

              async def _request_snapshot(self, ticker: str):
                  errors = []
                  for port in IBKR_PORTS:
                      ib = IB()
                      try:
                          await ib.connectAsync(
                              IBKR_HOST, port, clientId=IBKR_CLIENT_ID,
                              timeout=0.8, readonly=True,
                          )
                          contract = Stock(ticker, 'SMART', 'USD')
                          qualified = await ib.qualifyContractsAsync(contract)
                          if not qualified:
                              raise RuntimeError('contract qualification returned no result')
                          contract = qualified[0]

                          for data_type, label in ((1, 'live'), (3, 'delayed')):
                              ib.reqMarketDataType(data_type)
                              tickers = await ib.reqTickersAsync(contract)
                              if not tickers:
                                  continue
                              tick = tickers[0]
                              try:
                                  market_price = tick.marketPrice()
                              except Exception:
                                  market_price = None
                              try:
                                  midpoint = tick.midpoint()
                              except Exception:
                                  midpoint = None
                              price = positive_price(tick.last, market_price, midpoint, tick.close, tick.bid, tick.ask)
                              if price is not None:
                                  return {
                                      'price': price,
                                      'source': f'Interactive Brokers TWS API ({label} snapshot)',
                                      'market_data_type': int(getattr(tick, 'marketDataType', data_type) or data_type),
                                      'ibkr_port': port,
                                      'timestamp': datetime.now(timezone.utc).isoformat(),
                                  }
                          raise RuntimeError('IBKR connected but no usable market price was returned')
                      except Exception as exc:
                          errors.append(f'{port}:{type(exc).__name__}:{exc}')
                      finally:
                          try:
                              if ib.isConnected():
                                  ib.disconnect()
                          except Exception:
                              pass
                  raise RuntimeError('; '.join(errors) if errors else 'No IBKR ports configured')

              def get_snapshot(self, ticker: str):
                  with self.lock:
                      future = asyncio.run_coroutine_threadsafe(self._request_snapshot(ticker), self.loop)
                      try:
                          result = future.result(timeout=7.0)
                          self.last_error = None
                          return result
                      except Exception as exc:
                          future.cancel()
                          self.last_error = f'{type(exc).__name__}: {exc}'
                          raise RuntimeError(self.last_error) from exc


          ibkr = IBKRPriceProvider()


          def load_daily_features(ticker: str):
              stock = yf.Ticker(ticker)
              df = stock.history(period='90d', auto_adjust=False)
              if df.empty or 'Close' not in df.columns:
                  raise RuntimeError(f'No daily market history returned for {ticker}')
              df = df.copy()
              df.ta.rsi(length=14, append=True)
              df.ta.macd(fast=12, slow=26, signal=9, append=True)
              df['Returns'] = df['Close'].pct_change()
              df['Volatility'] = df['Returns'].rolling(window=20).std() * np.sqrt(252)
              latest = df.iloc[-1]
              daily_close = positive_price(latest['Close'])
              if daily_close is None:
                  raise RuntimeError(f'Invalid daily close for {ticker}')
              rsi = float(latest.get('RSI_14', np.nan))
              macd = float(latest.get('MACD_12_26_9', np.nan))
              vol = float(latest.get('Volatility', np.nan))
              if not np.isfinite(rsi): rsi = 50.0
              if not np.isfinite(macd): macd = 0.0
              if not np.isfinite(vol) or vol <= 0: vol = 0.25
              try:
                  ts = df.index[-1].isoformat()
              except Exception:
                  ts = datetime.now(timezone.utc).isoformat()
              return daily_close, rsi, macd, vol, ts


          def load_market_features(ticker: str):
              daily_close, rsi, macd, vol, daily_ts = load_daily_features(ticker)
              ibkr_quote = None
              ibkr_error = None
              try:
                  ibkr_quote = ibkr.get_snapshot(ticker)
              except Exception as exc:
                  ibkr_error = str(exc)

              if ibkr_quote is not None:
                  price = float(ibkr_quote['price'])
                  return price, rsi, macd, vol, ibkr_quote['timestamp'], ibkr_quote['source'], ibkr_quote, None

              # Preserve the already-working market path when no authenticated TWS/Gateway session exists.
              return (
                  daily_close, rsi, macd, vol, daily_ts,
                  'Yahoo Finance daily fallback; indicators match PPO training definitions',
                  None, ibkr_error,
              )


          def make_observation(stock_price, dte, position, rsi, macd, volatility, unrealized_pnl):
              if model is None:
                  raise RuntimeError('PPO model unavailable')
              obs = np.asarray(
                  [stock_price, float(dte), float(position), rsi, macd, volatility, unrealized_pnl],
                  dtype=np.float32,
              )
              obs = np.nan_to_num(obs, nan=0.0, posinf=0.0, neginf=0.0)
              if getattr(model.observation_space, 'shape', None) != (7,):
                  raise RuntimeError(f'Expected 7D model, got {model.observation_space}')
              return obs


          def run_policy(obs):
              raw_action, _ = model.predict(obs, deterministic=True)
              action = int(np.asarray(raw_action).reshape(-1)[0])
              if action not in ACTIONS:
                  raise RuntimeError(f'Unexpected PPO action: {action}')
              code, label, recommendation = ACTIONS[action]
              return action, code, label, recommendation


          @asynccontextmanager
          async def lifespan(app: FastAPI):
              global model, model_load_error
              try:
                  loaded = PPO.load(str(MODEL_PATH), device='cpu')
                  if getattr(loaded.observation_space, 'shape', None) != (7,):
                      raise RuntimeError(f'Expected 7D PPO model, got {loaded.observation_space}')
                  if getattr(loaded.action_space, 'n', None) != 3:
                      raise RuntimeError(f'Expected 3 actions, got {loaded.action_space}')
                  model = loaded
                  model_load_error = None
              except Exception as exc:
                  model = None
                  model_load_error = f'{type(exc).__name__}: {exc}'
                  logger.exception('PPO model load failed')
              yield


          app = FastAPI(
              title='PPO 7D IBKR-First Options API',
              description='IBKR-first quote + training-aligned daily indicators + deterministic 7D PPO inference. Read-only; no broker orders.',
              version='2.1.0',
              lifespan=lifespan,
          )


          @app.get('/health')
          def health():
              reachable = ibkr.reachable_ports()
              return {
                  'status': 'ok' if model is not None else 'degraded',
                  'model_loaded': model is not None,
                  'model_observation_shape': list(model.observation_space.shape) if model is not None else None,
                  'model_action_count': int(model.action_space.n) if model is not None else None,
                  'features': ['stock_price','dte','position','rsi','macd','volatility','unrealized_pnl'],
                  'market_policy': 'IBKR first; Yahoo Finance daily fallback',
                  'ibkr_host': IBKR_HOST,
                  'ibkr_candidate_ports': IBKR_PORTS,
                  'ibkr_reachable_ports': reachable,
                  'ibkr_gateway_reachable': bool(reachable),
                  'execution_enabled': False,
                  'version': '2.1.0',
                  'error': model_load_error,
              }


          @app.get('/api/market_status')
          def market_status():
              reachable = ibkr.reachable_ports()
              return {
                  'ibkr_gateway_reachable': bool(reachable),
                  'ibkr_reachable_ports': reachable,
                  'ibkr_candidate_ports': IBKR_PORTS,
                  'ibkr_readonly_client': True,
                  'ibkr_last_error': ibkr.last_error,
                  'fallback_ready': True,
                  'fallback_source': 'Yahoo Finance daily data',
                  'execution_enabled': False,
              }


          @app.post('/api/predict_action')
          def predict_action(req: Predict7DRequest):
              if model is None:
                  raise HTTPException(status_code=503, detail='PPO model unavailable; see /health')
              obs = make_observation(req.stock_price, req.dte, req.position, req.rsi, req.macd, req.volatility, req.unrealized_pnl)
              action, code, label, recommendation = run_policy(obs)
              return {
                  'observation': obs.tolist(),
                  'action': action,
                  'action_code': code,
                  'action_label': label,
                  'recommendation': recommendation,
                  'execution_enabled': False,
              }


          @app.post('/api/analyze_real_stock')
          def analyze_real_stock(req: RealMarketRequest):
              if model is None:
                  raise HTTPException(status_code=503, detail='PPO model unavailable; see /health')
              try:
                  ticker = normalize_ticker(req.ticker)
                  stock_price, rsi, macd, volatility, market_timestamp, market_source, ibkr_quote, ibkr_error = load_market_features(ticker)
                  current_option_estimate = None
                  unrealized_pnl = 0.0
                  if req.position == 1:
                      T = req.dte / 252.0
                      current_option_estimate = black_scholes_call(
                          stock_price, float(req.strike_price), T, RISK_FREE_RATE, volatility,
                      )
                      unrealized_pnl = current_option_estimate - float(req.entry_price)
                  obs = make_observation(stock_price, req.dte, req.position, rsi, macd, volatility, unrealized_pnl)
                  action, code, label, recommendation = run_policy(obs)
                  return {
                      'ticker': ticker,
                      'stock_price': stock_price,
                      'dte': req.dte,
                      'position': req.position,
                      'strike_price': req.strike_price,
                      'entry_price': req.entry_price,
                      'rsi': rsi,
                      'macd': macd,
                      'volatility': volatility,
                      'current_option_estimate': current_option_estimate,
                      'unrealized_pnl': unrealized_pnl,
                      'observation': obs.tolist(),
                      'action': action,
                      'action_code': code,
                      'action_label': label,
                      'recommendation': recommendation,
                      'market_source': market_source,
                      'market_timestamp': market_timestamp,
                      'ibkr_used': ibkr_quote is not None,
                      'ibkr_port': ibkr_quote.get('ibkr_port') if ibkr_quote else None,
                      'ibkr_market_data_type': ibkr_quote.get('market_data_type') if ibkr_quote else None,
                      'ibkr_fallback_reason': ibkr_error,
                      'indicator_source': 'daily history; RSI14, MACD(12,26,9), 20-day return volatility annualized sqrt(252)',
                      'model_version': 'ppo_option_model.zip / 7D policy',
                      'execution_enabled': False,
                  }
              except ValueError as exc:
                  raise HTTPException(status_code=422, detail=str(exc)) from exc
              except RuntimeError as exc:
                  raise HTTPException(status_code=503, detail=str(exc)) from exc
              except HTTPException:
                  raise
              except Exception as exc:
                  logger.exception('IBKR-first 7D analysis failed')
                  raise HTTPException(status_code=500, detail=f'Analysis failed: {type(exc).__name__}: {exc}') from exc
          PY

          chown "$USER:$USER" "$APP/main_api.py"
          runuser -u "$USER" -- "$PY" -m py_compile "$APP/main_api.py"

          systemctl restart ai-option-trader-api.service
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/tmp/health.json && break
            sleep 1
          done
          cat /tmp/health.json
          "$PY" - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h['model_loaded'] is True, h
          assert h['model_observation_shape'] == [7], h
          assert h['execution_enabled'] is False, h
          print('LOCAL_HEALTH_OK')
          PY

          curl -fsS http://127.0.0.1:8000/api/market_status >/tmp/market-status.json
          echo MARKET_STATUS="$(cat /tmp/market-status.json)"
          curl -fsS -X POST http://127.0.0.1:8000/api/analyze_real_stock \
            -H 'Content-Type: application/json' \
            -d '{"ticker":"AAPL","dte":8,"position":0}' >/tmp/aapl.json
          "$PY" - <<'PY'
          import json
          a=json.load(open('/tmp/aapl.json'))
          assert len(a['observation']) == 7, a
          assert a['action'] in [0,1,2], a
          assert a['execution_enabled'] is False, a
          print('LOCAL_AAPL_OK', json.dumps(a, ensure_ascii=False))
          PY

          URL="$(cat "$APP/.public_https_url" 2>/dev/null | head -n1 || true)"
          if [ -n "$URL" ]; then
            if curl -fsS --connect-timeout 5 --max-time 20 "$URL/health" >/tmp/public-health.json; then
              echo "PUBLIC_HEALTH_OK=$URL"
              if curl -fsS --connect-timeout 5 --max-time 35 -X POST "$URL/api/analyze_real_stock" \
                -H 'Content-Type: application/json' \
                -d '{"ticker":"AAPL","dte":8,"position":0}' >/tmp/public-aapl.json; then
                echo "PUBLIC_AAPL_OK=$(cat /tmp/public-aapl.json)"
              else
                echo "PUBLIC_AAPL_WARN=$URL"
              fi
            else
              echo "PUBLIC_HEALTH_WARN=$URL"
            fi
          fi
          echo "API_SERVICE=$(systemctl is-active ai-option-trader-api.service)"
          echo "TUNNEL_SERVICE=$(systemctl is-active ai-option-trader-tunnel.service 2>/dev/null || true)"
          REMOTE

          gcloud compute ssh "$VM_NAME" --project="$PROJECT_ID" --zone="$ZONE" --quiet --command='sudo bash -s' < /tmp/deploy-ibkr.sh | tee /tmp/deploy-ibkr.log
      - name: Publish deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo '## AI Option Trader IBKR-first deployment'
            echo
            echo "Status: **$STATUS**"
            echo
            echo '```text'
            grep -E '^(MODEL_7D_OK|LOCAL_HEALTH_OK|MARKET_STATUS=|LOCAL_AAPL_OK|PUBLIC_HEALTH_OK=|PUBLIC_HEALTH_WARN=|PUBLIC_AAPL_OK=|PUBLIC_AAPL_WARN=|API_SERVICE=|TUNNEL_SERVICE=)' /tmp/deploy-ibkr.log 2>/dev/null || tail -n 160 /tmp/deploy-ibkr.log 2>/dev/null || true
            echo '```'
          } >/tmp/report.md
          gh issue comment "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
