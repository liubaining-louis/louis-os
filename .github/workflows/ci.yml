name: ATLAS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify maturity history
        run: python -m atlas.maturity verify-history docs/maturity/scorecards

      - name: Run ATLAS benchmark
        run: python -m atlas.cli run-all

      - name: Generate HTML report
        run: python -m atlas.cli report

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
