name: ATLAS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Validate installed dependency graph
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q atlas scripts tests

      - name: Validate production policy, workflow budget and Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_production_policy -v
          python -m unittest tests.test_execution_issue_policy -v
          python -m json.tool config/production_policy.json >/dev/null
          python scripts/validate_workflow_governance.py
          grep -Eq '^USER[[:space:]]+louis$' Dockerfile

      - name: Reject obvious committed live-secret formats
        run: python scripts/scan_tracked_secrets.py

      - name: Run unit tests
        shell: bash
        run: |
          mkdir -p results
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee "results/unit_test_log_py${{ matrix.python-version }}.txt"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Verify maturity history
        if: matrix.python-version == '3.12'
        run: python -m atlas.maturity verify-history docs/maturity/scorecards

      - name: Run ATLAS benchmark
        if: matrix.python-version == '3.12'
        run: python -m atlas.cli run-all

      - name: Generate HTML report
        if: matrix.python-version == '3.12'
        run: python -m atlas.cli report

      - name: Upload benchmark results
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: atlas-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
