name: Debug capability tests

on:
  push:
    branches:
      - feat/capability-first-payable-sources
    paths:
      - "atlas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/debug-capability-tests.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Capture focused test output
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests.test_payable_source_adapters \
            tests.test_patch_capabilities \
            tests.test_capability_first_payable_scout \
            tests.test_capability_patch_builder -v > results/capability_test_debug.log 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> results/capability_test_debug.log
          exit 0
      - name: Persist diagnostics
        run: |
          git config user.name "louis-os-debug[bot]"
          git config user.email "louis-os-debug[bot]@users.noreply.github.com"
          git add -f results/capability_test_debug.log
          git commit -m "Record capability test diagnostics" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
