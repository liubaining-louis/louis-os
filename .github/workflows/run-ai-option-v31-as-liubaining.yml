name: Run AI Option V3.1 As Liubaining
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/run-ai-option-v31-as-liubaining.yml']
permissions:
  contents: read
  id-token: write
  issues: write
concurrency:
  group: ai-option-v31-training
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      PROJECT_ID: test-bot-499814
      ZONE: europe-central2-a
      VM_NAME: gemini12345
      STATUS_ISSUE: '451'
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Extract V3.1 remote payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/train-ai-option-v31.yml').read_text().splitlines()
          start=None; end=None
          for i,line in enumerate(p):
              if "cat >/tmp/v31.sh <<'REMOTE'" in line:
                  start=i+1; break
          if start is None: raise SystemExit('payload start not found')
          for j in range(start,len(p)):
              if p[j].strip()=='REMOTE':
                  end=j; break
          if end is None: raise SystemExit('payload end not found')
          payload=textwrap.dedent('\n'.join(p[start:end]))+'\n'
          Path('/tmp/v31.sh').write_text(payload)
          print('PAYLOAD_LINES',len(payload.splitlines()))
          PY
      - name: Execute on VM as liubaining
        shell: bash
        run: |
          set -o pipefail
          gcloud compute ssh "liubaining@$VM_NAME" --project="$PROJECT_ID" --zone="$ZONE" --quiet \
            --ssh-flag='-o ServerAliveInterval=30' --ssh-flag='-o ServerAliveCountMax=6' \
            --command='sudo bash -s' < /tmp/v31.sh 2>&1 | tee /tmp/run.log
      - name: Publish V3.1 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '## AI Option V3.1 liubaining execution'; echo; echo '```text'; tail -n 700 /tmp/run.log 2>/dev/null || echo 'No output'; echo '```'; } >/tmp/report.md
          gh issue comment "$STATUS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
