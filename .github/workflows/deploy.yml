name: Deploy Louis OS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "atlas/**"
      - "benchmarks/**"
      - "tests/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: louis-os-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m unittest discover -s tests -v
          python -m atlas.cli run-all

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: test-bot-499814
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build container
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="gcr.io/test-bot-499814/louis-os:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          BUILD_ID="$(gcloud builds submit \
            --project=test-bot-499814 \
            --tag="${IMAGE}" \
            --async \
            --format='value(id)' \
            .)"

          if [[ -z "${BUILD_ID}" ]]; then
            echo "Cloud Build did not return a build ID."
            exit 1
          fi

          echo "Cloud Build ID: ${BUILD_ID}"

          for attempt in $(seq 1 60); do
            STATUS="$(gcloud builds describe "${BUILD_ID}" \
              --project=test-bot-499814 \
              --format='value(status)')"
            echo "Build status: ${STATUS}"

            case "${STATUS}" in
              SUCCESS)
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed with status ${STATUS}."
                gcloud builds describe "${BUILD_ID}" --project=test-bot-499814
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Cloud Build ${BUILD_ID}."
          exit 1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy louis-os \
            --project=test-bot-499814 \
            --image="${IMAGE}" \
            --region=europe-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --port=8080 \
            --set-secrets="LOUIS_OS_API_KEY=louis-os-api-key:latest,LLM_API_KEY=groq-api-key:latest" \
            --set-env-vars="^@^LLM_PROVIDER=groq@LLM_PROVIDER_ORDER=groq,vertex@LLM_BASE_URL=https://api.groq.com/openai/v1@LLM_MODEL=llama-3.3-70b-versatile@VERTEX_PROJECT=test-bot-499814@VERTEX_LOCATION=global@VERTEX_MODEL=gemini-2.5-flash@MISSION_STORE=firestore@FIRESTORE_MISSIONS_COLLECTION=missions@MEMORY_STORE=firestore@FIRESTORE_MEMORIES_COLLECTION=memories@COMMAND_STORE=firestore@FIRESTORE_COMMANDS_COLLECTION=commands@AUTONOMOUS_CYCLE_STORE=firestore@FIRESTORE_CYCLES_COLLECTION=autonomous_cycles"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe louis-os --project=test-bot-499814 --region=europe-west1 --format='value(status.url)')"
          LOUIS_KEY="$(gcloud secrets versions access latest --project=test-bot-499814 --secret=louis-os-api-key)"
          curl --fail --silent --show-error "${SERVICE_URL}/health" | jq -e '.status == "ok" and .version == "0.8.0"'
          curl --fail --silent --show-error --dump-header /tmp/root-headers.txt --output /tmp/root.html "${SERVICE_URL}/"
          if grep -qi '^set-cookie: louis_session=' /tmp/root-headers.txt; then
            echo "Public root must not issue an authenticated session."
            exit 1
          fi
          ANON_CODE="$(curl --silent --show-error --output /tmp/anonymous.json --write-out '%{http_code}' "${SERVICE_URL}/missions?limit=1")"
          if [[ "${ANON_CODE}" != "401" ]]; then
            echo "Anonymous protected-route request returned HTTP ${ANON_CODE}; expected 401."
            cat /tmp/anonymous.json
            exit 1
          fi
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-Louis-Key: ${LOUIS_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"observation_key":"production-smoke-'"${GITHUB_SHA}"'","dry_run":true,"pull_requests":[],"deployments":[]}' \
            "${SERVICE_URL}/autonomous/cycles")"
          echo "${RESPONSE}" | jq -e '.dry_run == true and (.status == "simulated" or .status == "stopped")'

          CHAT_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-Louis-Key: ${LOUIS_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"prompt":"Lis le LIVE VM HEARTBEAT fourni dans ton contexte et donne la valeur exacte du champ worker. Inclus exactement cette valeur dans ta réponse."}' \
            "${SERVICE_URL}/ask")"
          echo "${CHAT_RESPONSE}" | jq .
          echo "${CHAT_RESPONSE}" | jq -e '.status == "completed" and (.answer | type == "string")'
          echo "${CHAT_RESPONSE}" | jq -r '.answer' | grep -Fq 'gcp_vm_monetization_worker'

      - name: Publish live-chat deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh issue comment 257 --repo "$GITHUB_REPOSITORY" --body "Cloud Run live-chat deployment completed with status: **${JOB_STATUS}**. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
