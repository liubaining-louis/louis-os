name: Louis Command Bridge

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  dispatch-command:
    if: >-
      startsWith(github.event.issue.title, 'Louis Command:') ||
      contains(github.event.issue.body || '', 'deterministic_superteam_executor') ||
      contains(github.event.issue.body || '', 'Owner authorization:')
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: test-bot-499814
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Dispatch command to Louis OS
        id: dispatch
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe louis-os --project=test-bot-499814 --region=europe-west1 --format='value(status.url)')"
          LOUIS_KEY="$(gcloud secrets versions access latest --project=test-bot-499814 --secret=louis-os-api-key)"
          ORDER_TITLE="${ISSUE_TITLE#Louis Command:}"
          ORDER="${ORDER_TITLE}"$'\n\n'"${ISSUE_BODY}"

          PAYLOAD="$(jq -n \
            --arg order "$ORDER" \
            --arg body "$ISSUE_BODY" \
            --arg source "github-issue" \
            --arg key "github-issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}" \
            --arg reference "github-issue-${ISSUE_NUMBER}" \
            --argjson issue_number "$ISSUE_NUMBER" \
            '{order: $order, source: $source, idempotency_key: $key, context: {issue_number: $issue_number, issue_body: $body, evidence: [{source: "github-issue", reference: $reference, content: $body, metadata: {issue_number: $issue_number}}]}}')"

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-Louis-Key: ${LOUIS_KEY}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${SERVICE_URL}/commands")"

          echo "$RESPONSE" | jq .
          {
            echo 'response<<EOF'
            echo "$RESPONSE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish Louis OS result
        env:
          GH_TOKEN: ${{ github.token }}
          RESPONSE: ${{ steps.dispatch.outputs.response }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          STATUS="$(echo "$RESPONSE" | jq -r '.status // "unknown"')"
          COMMAND_ID="$(echo "$RESPONSE" | jq -r '.command_id // "unknown"')"
          EXECUTION_MODE="$(echo "$RESPONSE" | jq -r '.execution_mode // "unknown"')"
          EVIDENCE_COUNT="$(echo "$RESPONSE" | jq -r '(.evidence // []) | length')"
          EVIDENCE="$(echo "$RESPONSE" | jq -r '(.evidence // []) | if length == 0 then "none" else map("- `" + . + "`") | join("\n") end')"
          DIAGNOSIS="$(echo "$RESPONSE" | jq -r '.diagnosis // {} | if length == 0 then "none" else tojson end')"
          RESULT="$(echo "$RESPONSE" | jq -r '.result // .error // "No result yet"')"
          DELIVERABLE="$(echo "$RESPONSE" | jq -r '(.result // "") | fromjson? | .deliverable.content // empty')"
          DELIVERABLE_PATH="$(echo "$RESPONSE" | jq -r '(.result // "") | fromjson? | .deliverable.path // empty')"
          DELIVERABLE_SHA="$(echo "$RESPONSE" | jq -r '(.result // "") | fromjson? | .deliverable.sha256 // empty')"
          DELIVERABLE_TRUNCATED="$(echo "$RESPONSE" | jq -r '(.result // "") | fromjson? | .deliverable.truncated // false')"
          DELIVERABLE_CHARS="$(echo "$RESPONSE" | jq -r '(.result // "") | fromjson? | .deliverable.chars_total // 0')"

          if [[ "$STATUS" == "completed" && "$EVIDENCE_COUNT" == "0" ]]; then
            STATUS="failed"
            RESULT="evidence_contract_violation: Louis OS returned completed without any verifiable evidence. The command must be retried through a deterministic executor or reported as blocked."
          fi

          COMMENT_FILE="$(mktemp)"
          cat > "$COMMENT_FILE" <<EOF
          Louis OS command \`$COMMAND_ID\` — status: **$STATUS**

          - Execution mode: \`$EXECUTION_MODE\`
          - Evidence count: \`$EVIDENCE_COUNT\`

          **Evidence**
          $EVIDENCE

          **Diagnosis**
          \`\`\`json
          $DIAGNOSIS
          \`\`\`

          **Result**
          \`\`\`text
          $RESULT
          \`\`\`
          EOF

          if [[ -n "$DELIVERABLE" ]]; then
            {
              echo
              echo "## Runtime deliverable"
              echo
              echo "- Path: \`$DELIVERABLE_PATH\`"
              if [[ -n "$DELIVERABLE_SHA" && "$DELIVERABLE_SHA" != "null" ]]; then
                echo "- SHA-256: \`$DELIVERABLE_SHA\`"
              fi
              echo "- Runtime chars: \`$DELIVERABLE_CHARS\`"
              echo "- Snapshot truncated: \`$DELIVERABLE_TRUNCATED\`"
              echo
              echo "<details open>"
              echo "<summary>Readable deliverable snapshot</summary>"
              echo
              printf '%s\n' "$DELIVERABLE"
              echo
              echo "</details>"
            } >> "$COMMENT_FILE"
          fi

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$COMMENT_FILE"

          if [[ "$STATUS" == "completed" || "$STATUS" == "failed" || "$STATUS" == "blocked" ]]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi
