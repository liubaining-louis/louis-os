name: Dispatch AI Option Trader Operations

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    if: startsWith(github.event.issue.title, 'AI Option Deploy:') || startsWith(github.event.issue.title, 'AI Option Verify:') || startsWith(github.event.issue.title, 'AI Option Fast Locate:') || startsWith(github.event.issue.title, 'AI Option Inspect:') || startsWith(github.event.issue.title, 'AI Option Gateway:')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch requested workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [[ "$ISSUE_TITLE" == AI\ Option\ Deploy:* ]]; then
            WORKFLOW='deploy-ai-option-trader-7d.yml'
            LABEL='AI Option Trader verified 7D deployment'
          elif [[ "$ISSUE_TITLE" == AI\ Option\ Verify:* ]]; then
            WORKFLOW='verify-ai-option-trader-public.yml'
            LABEL='AI Option Trader public HTTPS verification'
          elif [[ "$ISSUE_TITLE" == AI\ Option\ Fast\ Locate:* ]]; then
            WORKFLOW='fast-locate-ai-option-trader.yml'
            LABEL='AI Option Trader asset locator'
          elif [[ "$ISSUE_TITLE" == AI\ Option\ Inspect:* ]]; then
            WORKFLOW='inspect-ai-option-trader-model.yml'
            LABEL='AI Option Trader model inspection'
          elif [[ "$ISSUE_TITLE" == AI\ Option\ Gateway:* ]]; then
            WORKFLOW='setup-ib-gateway-persistent.yml'
            LABEL='persistent official IB Gateway setup'
          else
            exit 0
          fi
          gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Dedicated ${LABEL} workflow dispatched explicitly from main."
