name: Finalize MoltJobs ChatGPT Exam

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moltjobs-chatgpt-exam-finalize.yml'

permissions:
  contents: read
  issues: write
  id-token: write

env:
  PROJECT_ID: test-bot-499814
  ZONE: europe-west1-b
  VM_NAME: louis-os-worker-01

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Install fixed relay and finalize existing session
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute scp scripts/moltjobs_chatgpt_exam_relay.py \
            "${VM_NAME}:/tmp/moltjobs_chatgpt_exam_relay.py" \
            --project="${PROJECT_ID}" --zone="${ZONE}" --quiet
          RESULT="$(gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --quiet \
            --command='sudo python3 /tmp/moltjobs_chatgpt_exam_relay.py finalize')"
          echo 'result<<EOF' >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RESULT" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
      - name: Publish final report
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.finalize.outputs.result }}
        run: |
          set -euo pipefail
          ANSWERED="$(jq -r '.answered // 0' <<<"$RESULT")"
          REPORT="$(jq -c '.report // {}' <<<"$RESULT")"
          cat >/tmp/comment.md <<EOF
          MOLTJOBS_RELAY_FINISHED

          Answered: ${ANSWERED}

          Report:
          \`\`\`json
          ${REPORT}
          \`\`\`
          EOF
          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
